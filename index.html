<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101522">
<title>Block Fusion</title>
<style>
:root{
  --bg1:#0b1020; --bg2:#18233c; --panel:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09); --text:#f7f9ff; --muted:#aab4ca;
  --accent:#7c5cff; --good:#4ee6a5; --bad:#ff617d;
  --cell:min(10.5vw,52px); --gap:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:
radial-gradient(circle at 15% 10%,rgba(124,92,255,.28),transparent 32%),
radial-gradient(circle at 85% 85%,rgba(45,211,191,.18),transparent 30%),
linear-gradient(145deg,var(--bg1),var(--bg2));}
html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
body{min-height:100dvh;overflow-x:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.hidden{display:none!important}
#app{min-height:100dvh;padding:calc(12px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.screen{width:min(620px,100%);min-height:calc(100dvh - 24px);display:flex;flex-direction:column}
.menu{justify-content:center;align-items:center;text-align:center;gap:18px}
.logo{font-size:clamp(40px,12vw,72px);font-weight:950;letter-spacing:-3px;line-height:.95;
background:linear-gradient(135deg,#fff,#9d8cff 55%,#5ff0c1);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);font-size:14px;margin-top:-8px}
.card{background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.22);backdrop-filter:blur(18px);border-radius:24px}
.menu-card{padding:18px;width:min(420px,100%)}
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mode,.primary,.secondary,.icon-btn{border-radius:16px;padding:13px 16px;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:.18s}
.mode.active{background:linear-gradient(135deg,rgba(124,92,255,.75),rgba(95,240,193,.35));border-color:rgba(255,255,255,.28)}
.primary{width:100%;font-weight:850;font-size:20px;background:linear-gradient(135deg,#7c5cff,#5fe6c1);box-shadow:0 12px 28px rgba(124,92,255,.25)}
.primary:active,.mode:active,.secondary:active,.icon-btn:active{transform:scale(.97)}
.secondary{background:rgba(255,255,255,.06)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{padding:10px;border-radius:15px;background:rgba(0,0,0,.13)}
.stat b{display:block;font-size:19px}.stat small{color:var(--muted)}
.game{gap:10px}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.brand-mini{font-weight:900;font-size:18px}.brand-mini span{color:#9c8cff}
.score{text-align:center}.score small,.best small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px}
.score strong{font-size:26px;line-height:1}
.best{text-align:right}
.combo{min-height:23px;text-align:center;font-weight:900;color:#ffd866;opacity:0;transform:scale(.8);transition:.2s}
.combo.show{opacity:1;transform:scale(1)}
.board-wrap{position:relative;display:flex;justify-content:center}
.board{display:grid;gap:var(--gap);padding:var(--gap);border-radius:20px;background:rgba(0,0,0,.18);border:1px solid var(--line);touch-action:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.22)}
.cell{width:var(--cell);height:var(--cell);border-radius:7px;background:rgba(255,255,255,.055);transition:transform .12s,background .12s,box-shadow .12s;position:relative}
.cell.filled{background:var(--c);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.22);animation:pop .16s ease-out}
.cell.preview-ok{background:rgba(78,230,165,.48);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.cell.preview-bad{background:rgba(255,97,125,.45)}
.cell.clearing{animation:clear .34s ease-in forwards}
@keyframes pop{from{transform:scale(.72);opacity:.2}to{transform:scale(1);opacity:1}}
@keyframes clear{0%{transform:scale(1);opacity:1}55%{transform:scale(1.28);opacity:1}100%{transform:scale(.1);opacity:0}}
.bottom{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.pieces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:105px}
.piece-slot{touch-action:none;touch-action:none;user-select:none;-webkit-user-select:none;
min-height:100px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;touch-action:none}
.piece-grid{display:grid;gap:3px;transform-origin:center}
.piece-cell{width:18px;height:18px;border-radius:4px;background:var(--pc);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 3px 7px rgba(0,0,0,.2)}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.98;filter:drop-shadow(0 18px 18px rgba(0,0,0,.42));transform:translate3d(0,0,0) scale(1.08);will-change:transform;transform-origin:center center;transition:filter .12s ease,opacity .12s ease}.drag-ghost.bf-dragging{filter:drop-shadow(0 22px 24px rgba(0,0,0,.48))}.drag-ghost.bf-near{filter:drop-shadow(0 0 14px rgba(95,240,193,.55))}.drag-ghost.bf-invalid{filter:drop-shadow(0 0 14px rgba(255,97,125,.45))}.cell.preview-ok{animation:magnetPulse .32s ease-in-out infinite alternate}.cell.preview-bad{animation:badPulse .22s ease-in-out infinite alternate}.cell.bf-landed{animation:bfLand .34s cubic-bezier(.16,1.3,.3,1)}@keyframes magnetPulse{from{transform:scale(.98)}to{transform:scale(1.045)}}@keyframes badPulse{from{transform:scale(1)}to{transform:scale(.94)}}@keyframes bfLand{0%{transform:translateY(-9px) scale(.84);opacity:.5}55%{transform:translateY(2px) scale(1.08);opacity:1}78%{transform:translateY(-1px) scale(.98)}100%{transform:translateY(0) scale(1);opacity:1}}
.hud-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.action{padding:11px;border-radius:15px;background:rgba(255,255,255,.055);border:1px solid var(--line);font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(4,7,15,.68);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:200}
.modal{width:min(430px,100%);padding:22px}
.modal h2{margin:0 0 12px;font-size:30px}.modal p{color:var(--muted)}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.toggle{padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.08)}.toggle.on{background:rgba(78,230,165,.22);color:#6ff2b4}
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-20px);opacity:0;z-index:300;padding:10px 17px;border-radius:16px;background:rgba(20,25,40,.9);border:1px solid rgba(255,255,255,.15);font-weight:900;pointer-events:none;transition:.3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:250}
.confetti{position:absolute;width:7px;height:7px;border-radius:2px;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(500deg);opacity:0}}
@media(max-height:700px){
  :root{--cell:min(9.5vw,44px)}
  .pieces{min-height:82px}.piece-slot{touch-action:none;touch-action:none;user-select:none;-webkit-user-select:none;
min-height:78px}.piece-cell{width:15px;height:15px}
}
@media(min-width:700px){:root{--cell:48px}}

/* ===== ENHANCED VISUAL FX ===== */
.cell.filled{
  overflow:visible;
  transform:translateZ(0);
  background:
    linear-gradient(145deg,rgba(255,255,255,.42),transparent 28%),
    linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c),#111 22%));
}
.cell.filled::before{
  content:"";position:absolute;inset:2px;border-radius:5px;
  background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 45%);
  pointer-events:none;
}
.cell.filled::after{
  content:"";position:absolute;left:18%;right:18%;top:9%;height:18%;
  border-radius:50%;background:rgba(255,255,255,.34);filter:blur(2px);
}
.cell.land{animation:land .32s cubic-bezier(.2,1.5,.35,1)}
@keyframes land{
  0%{transform:scale(.45) rotate(-5deg);opacity:.1}
  55%{transform:scale(1.16) rotate(2deg)}
  100%{transform:scale(1)}
}
.cell.preview-ok{animation:previewPulse .55s ease-in-out infinite alternate}
@keyframes previewPulse{to{filter:brightness(1.35);transform:scale(.93)}}
.piece-slot{touch-action:none;touch-action:none;user-select:none;-webkit-user-select:none;
position:relative;overflow:visible}
.piece-slot::before{
  content:"";position:absolute;inset:18%;border-radius:50%;
  background:radial-gradient(circle,rgba(124,92,255,.18),transparent 70%);
  filter:blur(12px);opacity:.7;pointer-events:none
}
.piece-grid{position:relative;z-index:1;animation:pieceFloat 2.2s ease-in-out infinite}
.piece-slot:nth-child(2) .piece-grid{animation-delay:-.7s}
.piece-slot:nth-child(3) .piece-grid{animation-delay:-1.4s}
@keyframes pieceFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(.7deg)}}
.piece-cell{
  position:relative;border-radius:5px;
  background:linear-gradient(145deg,rgba(255,255,255,.45),transparent 25%),linear-gradient(145deg,var(--pc),color-mix(in srgb,var(--pc),#111 22%));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.12),0 5px 9px rgba(0,0,0,.24);
}
.piece-cell::after{content:"";position:absolute;left:16%;right:16%;top:8%;height:16%;border-radius:50%;background:rgba(255,255,255,.38);filter:blur(1px)}
.line-flash{
  position:fixed;z-index:245;pointer-events:none;border-radius:50%;
  width:20px;height:20px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,255,255,1) 0,rgba(124,92,255,.75) 25%,transparent 70%);
  animation:lineFlash .48s ease-out forwards;
}
@keyframes lineFlash{0%{width:15px;height:15px;opacity:1}100%{width:190px;height:190px;opacity:0}}
.shockwave{
  position:fixed;z-index:244;pointer-events:none;width:20px;height:20px;border:3px solid rgba(255,255,255,.85);
  border-radius:50%;transform:translate(-50%,-50%);animation:shock .62s cubic-bezier(.1,.7,.2,1) forwards;
}
@keyframes shock{to{width:360px;height:360px;border-width:0;opacity:0}}
.spark{
  position:fixed;z-index:246;pointer-events:none;width:5px;height:5px;border-radius:50%;
  transform:translate(-50%,-50%);animation:sparkFly .65s cubic-bezier(.1,.7,.2,1) forwards;
}
@keyframes sparkFly{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.1);opacity:0}}
.float-score{
  position:fixed;z-index:260;pointer-events:none;font-weight:1000;font-size:20px;
  text-shadow:0 3px 12px rgba(0,0,0,.6);animation:floatScore .9s ease-out forwards;
}
@keyframes floatScore{0%{opacity:0;transform:translate(-50%,0) scale(.65)}15%{opacity:1;transform:translate(-50%,-8px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-75px) scale(.9)}}
.combo-burst{
  position:fixed;z-index:261;pointer-events:none;left:50%;top:42%;font-weight:1000;font-size:clamp(32px,10vw,68px);
  color:#fff;text-shadow:0 0 8px #7c5cff,0 0 35px #5fe6c1,0 7px 25px rgba(0,0,0,.5);
  animation:comboBurst .85s cubic-bezier(.15,.9,.2,1) forwards;
}
@keyframes comboBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(2deg)}65%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-65%) scale(1.25)}}
.board.combo-hit{animation:boardHit .32s ease-out}
@keyframes boardHit{0%{transform:scale(1)}35%{transform:scale(1.018);filter:brightness(1.2)}100%{transform:scale(1)}}

/* ===== SPLASH + SHOP ===== */
#splash{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;overflow:hidden;
background:radial-gradient(circle at 50% 35%,rgba(124,92,255,.28),transparent 32%),linear-gradient(145deg,#070a14,#111a30 55%,#071a1a);
animation:splashOut .8s 2.15s ease forwards}
#splash.hide{display:none}
.splash-orb{position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(2px);opacity:.28;animation:orbFloat 3s ease-in-out infinite}
.splash-orb.a{background:#7c5cff;left:-45px;top:10%;}.splash-orb.b{background:#4ee6a5;right:-55px;bottom:8%;animation-delay:-1s}
.splash-content{text-align:center;position:relative;z-index:2;animation:splashIn .9s cubic-bezier(.1,.9,.2,1)}
.splash-logo{font-size:clamp(48px,15vw,88px);font-weight:1000;letter-spacing:-5px;
background:linear-gradient(135deg,#fff 15%,#a18cff 52%,#61f3c1 90%);-webkit-background-clip:text;background-clip:text;color:transparent;
text-shadow:0 10px 50px rgba(124,92,255,.25)}
.splash-sub{margin-top:8px;color:#aeb8cf;font-size:13px;letter-spacing:4px;text-transform:uppercase}
.splash-loader{width:150px;height:4px;background:rgba(255,255,255,.1);border-radius:9px;margin:28px auto 0;overflow:hidden}
.splash-loader i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#5fe6c1);animation:load 1.8s ease forwards}
@keyframes splashIn{from{opacity:0;transform:scale(.75) translateY(25px)}to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes load{to{width:100%}} @keyframes orbFloat{50%{transform:translateY(-25px) scale(1.12)}}
.shop-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.shop-title{font-size:30px;font-weight:950}.coins{padding:9px 13px;border-radius:14px;background:rgba(255,210,75,.12);border:1px solid rgba(255,210,75,.25);color:#ffd65a;font-weight:900}
.shop-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.shop-tab{padding:9px 4px;border-radius:12px;background:rgba(255,255,255,.05);color:var(--muted);font-size:11px}
.shop-tab.active{background:rgba(124,92,255,.25);color:#fff}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-height:58vh;overflow:auto;padding:2px}
.shop-item{padding:10px;border-radius:17px;background:rgba(255,255,255,.055);border:1px solid var(--line);text-align:left}
.item-preview{height:92px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;position:relative;overflow:hidden}
.item-name{font-weight:850;font-size:13px}.item-desc{font-size:10px;color:var(--muted);margin:3px 0 8px;min-height:24px}
.buy{width:100%;padding:8px;border-radius:11px;background:rgba(255,255,255,.09);font-size:12px;font-weight:850}
.buy.equipped{background:rgba(78,230,165,.2);color:#69f1b5}
.buy.locked{opacity:.5}
.mini-coin{color:#ffd65a}
.preview-dark{background:linear-gradient(145deg,#0b1020,#25375b)}
.preview-neon{background:radial-gradient(circle,#513dff,#080b18 65%)}
.preview-sunset{background:linear-gradient(145deg,#3b183f,#ff704d 50%,#111426)}
.preview-ocean{background:linear-gradient(145deg,#061c3a,#12a9a1 65%,#08121f)}
.shop-block{display:grid;grid-template-columns:repeat(3,22px);gap:4px}
.shop-block i{width:22px;height:22px;border-radius:5px;display:block;box-shadow:inset 0 2px rgba(255,255,255,.3),0 4px 8px #0005}
.skin-gem i{background:linear-gradient(135deg,#fff,#8b72ff 45%,#39f0ce)}
.skin-fire i{background:linear-gradient(135deg,#fff16a,#ff6a32 45%,#d81f5b)}
.skin-ice i{background:linear-gradient(135deg,#fff,#62dfff 45%,#477cff)}
.skin-gold i{background:linear-gradient(135deg,#fff7a0,#ffc400 45%,#b56b00)}
.lock-icon{font-size:25px;opacity:.45}
.splash-preview{font-size:34px;font-weight:1000}

/* ===== MOBILE GAME SHOP V2 ===== */
.shop-modal{padding:0!important;overflow:hidden;background:linear-gradient(160deg,rgba(19,25,45,.98),rgba(8,12,24,.98))}
.shop-top{padding:16px 16px 12px;background:linear-gradient(180deg,rgba(124,92,255,.22),transparent);border-bottom:1px solid rgba(255,255,255,.08)}
.shop-topline{display:flex;align-items:center;justify-content:space-between}
.shop-heading{font-size:28px;font-weight:1000;letter-spacing:-1px}
.wallet{display:flex;align-items:center;gap:6px;background:rgba(255,211,73,.13);border:1px solid rgba(255,211,73,.3);border-radius:14px;padding:8px 11px;color:#ffd54a;font-weight:950}
.wallet-plus{width:22px;height:22px;border-radius:50%;background:#ffd54a;color:#3b2800;font-weight:1000}
.shop-banner{margin-top:12px;padding:13px;border-radius:17px;background:linear-gradient(100deg,rgba(124,92,255,.32),rgba(95,230,193,.12));border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between}
.shop-banner b{font-size:15px}.shop-banner small{display:block;color:#b9c1d5;margin-top:3px}
.shop-banner .gift{font-size:31px;filter:drop-shadow(0 5px 10px #7c5cff88)}
.shop-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px 12px 8px}
.shop-nav button{padding:9px 3px;border-radius:12px;background:transparent;color:#8e98af;font-size:10px;font-weight:850}
.shop-nav button.active{background:rgba(124,92,255,.22);color:#fff;box-shadow:inset 0 0 0 1px rgba(124,92,255,.25)}
.shop-scroll{padding:2px 12px 14px;max-height:54vh;overflow:auto}
.shop-feature{margin-bottom:10px}
.feature-card{min-height:132px;border-radius:20px;position:relative;overflow:hidden;padding:15px;border:1px solid rgba(255,255,255,.12);background:radial-gradient(circle at 80% 25%,rgba(95,230,193,.22),transparent 30%),linear-gradient(135deg,#25205b,#11172b)}
.feature-card::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-65px;border:18px solid rgba(255,255,255,.05)}
.feature-art{position:absolute;right:18px;bottom:12px;font-size:56px;filter:drop-shadow(0 10px 15px #0008);transform:rotate(8deg)}
.feature-copy{position:relative;z-index:1;max-width:62%}
.feature-copy .rarity{font-size:9px;letter-spacing:1.5px;color:#70efbd;font-weight:1000}
.feature-copy h3{margin:5px 0 2px;font-size:21px}.feature-copy p{margin:0;color:#b8c1d5;font-size:11px}
.item-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.shop-card{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 20px rgba(0,0,0,.16)}
.shop-card.r-common{border-color:rgba(180,190,210,.16)}.shop-card.r-rare{border-color:rgba(76,157,255,.34)}.shop-card.r-epic{border-color:rgba(178,91,255,.45)}.shop-card.r-legendary{border-color:rgba(255,188,58,.55)}
.card-art{height:105px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card-art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.12),transparent 55%)}
.r-rare .card-art{background:linear-gradient(145deg,#101f42,#142d55)}.r-epic .card-art{background:linear-gradient(145deg,#25133d,#35205e)}.r-legendary .card-art{background:linear-gradient(145deg,#3b270b,#503a12)}
.rarity-tag{position:absolute;left:7px;top:7px;font-size:8px;font-weight:1000;letter-spacing:.7px;padding:4px 6px;border-radius:7px;background:rgba(0,0,0,.35);backdrop-filter:blur(5px)}
.r-rare .rarity-tag{color:#63b7ff}.r-epic .rarity-tag{color:#ca8cff}.r-legendary .rarity-tag{color:#ffd65a}
.card-price{position:absolute;right:7px;top:7px;font-size:9px;padding:4px 6px;border-radius:7px;background:rgba(0,0,0,.38);color:#ffd65a;font-weight:950}
.card-html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
body{padding:9px}.card-name{font-weight:900;font-size:13px}.card-sub{color:#8993aa;font-size:9px;margin:2px 0 8px;height:13px}
.card-btn{width:100%;padding:8px;border-radius:10px;background:rgba(255,255,255,.08);font-size:10px;font-weight:950}
.card-btn.buyable{background:linear-gradient(135deg,#7c5cff,#5fe6c1);color:white}
.card-btn.equipped{background:rgba(78,230,165,.16);color:#68f2b4;border:1px solid rgba(78,230,165,.25)}
.card-btn:active{transform:scale(.97)}

function cellAt(r,c){return r>=0&&c>=0&&r<state.size&&c<state.size}
function canPlace(shape,rr,cc){
  for(let r=0;r<shape.length;r++)for(let c=0;c<shape[r].length;c++)if(shape[r][c]){
    if(!cellAt(rr+r,cc+c)||state.board[rr+r][cc+c])return false;
  }
  return true;
}
function place(shape,rr,cc,color){
  let count=0;
  for(let r=0;r<shape.length;r++)for(let c=0;c<shape[r].length;c++)if(shape[r][c]){
    state.board[rr+r][cc+c]=color;count++;

  state.score+=count;
  return count;

function findLines(){
  const rows=[],cols=[];
  for(let r=0;r<state.size;r++)if(state.board[r].every(Boolean))rows.push(r);
  for(let c=0;c<state.size;c++)if(state.board.every(row=>row[c]))cols.push(c);
  return {rows,cols};
}

function lineExplosion(count, cells){

  const boardRect=$("#board").getBoundingClientRect();

  cells.forEach(el=>{
    const r=el.getBoundingClientRect();

  });
  if(!centers.length)return;
  const cx=centers.reduce((a,b)=>a+b.x,0)/centers.length;
  const cy=centers.reduce((a,b)=>a+b.y,0)/centers.length;
  const flash=document.createElement("div");flash.className="line-flash";flash.style.left=cx+"px";flash.style.top=cy+"px";document.body.appendChild(flash);
  const wave=document.createElement("div");wave.className="shockwave";wave.style.left=cx+"px";wave.style.top=cy+"px";document.body.appendChild(wave);
  setTimeout(()=>{flash.remove();wave.remove()},700);
  const amount=count>=3?110:count===2?70:40;
  cells.slice(0,amount).forEach((el,i)=>{
    const r=el.getBoundingClientRect();
    const sp=document.createElement("i");sp.className="spark";
    sp.style.left=(r.left+r.width/2)+"px";sp.style.top=(r.top+r.height/2)+"px";
    sp.style.background=rand(colors);

    document.body.appendChild(sp);setTimeout(()=>sp.remove(),700);
  });
  const fs=document.createElement("div");fs.className="float-score";
  fs.textContent=count>=3?`+${count} LINES!`:count===2?"+2 LINES":"LINE CLEAR!";
  fs.style.left=cx+"px";fs.style.top=cy+"px";document.body.appendChild(fs);setTimeout(()=>fs.remove(),950);
  if(count>=2){
    const cb=document.createElement("div");cb.className="combo-burst";
    cb.textContent=`COMBO ×${Math.max(2,state.combo+1)}`;document.body.appendChild(cb);setTimeout(()=>cb.remove(),900);
  }
  $("#board").classList.add("combo-hit");setTimeout(()=>$("#board").classList.remove("combo-hit"),340);

function clearLines(lines){
  const set=new Set();
  lines.rows.forEach(r=>{for(let c=0;c<state.size;c++)set.add(r+","+c)});
  lines.cols.forEach(c=>{for(let r=0;r<state.size;r++)set.add(r+","+c)});
  set.forEach(key=>{const [r,c]=key.split(",").map(Number);state.board[r][c]=null});
  const n=lines.rows.length+lines.cols.length;
  if(n){
    state.combo++; state.maxCombo=Math.max(state.maxCombo,state.combo);
    const base=[0,100,250,450,700,1000][Math.min(n,5)];
    state.score+=base+(state.combo>1?Math.round(base*(state.combo-1)*.18):0);
    state.lines+=n;
    const reward=(n*15)+(n>=2?25*n:0)+(state.combo>1?state.combo*5:0);
    state.coins+=reward; saveShop();
    if(state.vibration) vibrate(n>=2?[25,35,25]:30);
    if(state.sound) tone(n>=2?620:460,.13,"sine");
    if(state.animations) burst(n>=2?55:25);
    toast(n===1?"+ линия":`+ ${n} линии`);
  }else state.combo=0;
  return n;
}
function animateClear(cells,done){
  if(!state.animations){done();return}
  cells.forEach(el=>el.classList.add("clearing"));
  setTimeout(done,280);
}
function finishMove(){
  const lines=findLines();
  const els=[];
  lines.rows.forEach(r=>{for(let c=0;c<state.size;c++){const e=$(`.cell[data-r="${r}"][data-c="${c}"]`);if(e)els.push(e)}})
  lines.cols.forEach(c=>{for(let r=0;r<state.size;r++){const e=$(`.cell[data-r="${r}"][data-c="${c}"]`);if(e)els.push(e)}})
  const unique=[...new Set(els)];
  if(unique.length){
    lineExplosion(lines.rows.length+lines.cols.length, unique);
  }
  const afterClear=()=>{
    clearLines(lines);
    state.pieces=state.pieces.filter(p=>!p.used);
    while(state.pieces.length<3)state.pieces.push(newPiece());
    render();
    if(state.lastPlaced){
      const lp=state.lastPlaced;
      for(let r=0;r<lp.shape.length;r++)for(let c=0;c<lp.shape[r].length;c++)if(lp.shape[r][c]){
        const e=$(`.cell[data-r="${lp.rr+r}"][data-c="${lp.cc+c}"]`);if(e)e.classList.add('bf-landed');
      }
      setTimeout(()=>{$$('.cell.bf-landed').forEach(e=>e.classList.remove('bf-landed'))},360);
      state.lastPlaced=null;
    }
    updateHud();persist();
    if(state.score>best()){setBest(state.score);updateHud();toast("NEW RECORD!");burst(90)}
    setTimeout(checkGameOver,0);
  };
  if(unique.length) animateClear(unique,afterClear); else afterClear();
}
function checkGameOver(){
  const possible=state.pieces.some(p=>{
    for(let r=0;r<state.size;r++)for(let c=0;c<state.size;c++)if(canPlace(p.shape,r,c))return true;
    return false;
  });
  if(!possible)gameOver();
}

let boardCells=[];
function getBoardPosition(){
  const rect=$("#board").getBoundingClientRect();
  const gap=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap"));
  const step=(rect.width-8-(state.size-1)*gap)/state.size;
  return {rect,cell:step+gap};
}
function preview(rr,cc,shape,ok){
  const d=state.dragging;
  if(d?.previewKey===rr+","+cc+","+ok)return;
  if(d) d.previewKey=rr+","+cc+","+ok;
  if(d?.previewEls){for(const e of d.previewEls)e.classList.remove("preview-ok","preview-bad");}
  const cls=ok?"preview-ok":"preview-bad", els=[];
  for(let r=0;r<shape.length;r++)for(let c=0;c<shape[r].length;c++)if(shape[r][c]){
    const e=boardCells[(rr+r)*state.size+(cc+c)];
    if(e){e.classList.add(cls);els.push(e);}
  }
  if(d)d.previewEls=els;
}
function startDrag(ev){
  ev.preventDefault();
  if(state.paused)return;
  ensureAudio();
  const slot=ev.currentTarget,i=+slot.dataset.i,p=state.pieces[i];
  if(!p||p.used)return;
  const source=slot.querySelector('.piece-grid');
  const ghost=source.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.style.gridTemplateColumns=`repeat(${p.shape[0].length},18px)`;
  document.body.appendChild(ghost);
  const pos=getBoardPosition();
  state.dragging={i,p,ghost,last:null,rect:pos.rect,cell:pos.cell,raf:0,queued:null,previewEls:[],vx:0,vy:0,visualX:ev.clientX,visualY:ev.clientY,targetX:ev.clientX,targetY:ev.clientY,angle:0,scale:1.08,near:false};
  ghost.classList.add('bf-dragging');
  try{slot.releasePointerCapture?.(ev.pointerId)}catch(e){}
  updateDrag(ev,true);
  window.addEventListener('pointermove',moveDrag,{passive:false});
  window.addEventListener('pointerup',endDrag,{passive:false,once:true});
  window.addEventListener('pointercancel',endDrag,{passive:false,once:true});
}
function updateDrag(ev,immediate=false){
  const d=state.dragging;if(!d)return;
  d.targetX=ev.clientX;d.targetY=ev.clientY;
  d.queued={x:ev.clientX,y:ev.clientY};
  if(immediate){
    d.visualX=d.targetX;d.visualY=d.targetY;
  }
  if(!d.visualRAF){
    const tick=()=>{
      d.visualRAF=0;
      if(!state.dragging)return;
      const ease=immediate?.9:.28;
      d.visualX+=(d.targetX-d.visualX)*ease;
      d.visualY+=(d.targetY-d.visualY)*ease;
      const dx=d.targetX-d.visualX,dy=d.targetY-d.visualY;
      const speed=Math.hypot(dx,dy);
      d.vx=d.vx*.72+dx*.28; d.vy=d.vy*.72+dy*.28;
      d.angle=Math.max(-9,Math.min(9,d.vx*.055));
      d.scale=1.075+Math.min(.055,speed*.0008);
      const gw=d.ghost.offsetWidth||36,gh=d.ghost.offsetHeight||36;
      const lift=-Math.min(22,8+Math.hypot(d.vx,d.vy)*.12);
      d.ghost.style.transform=`translate3d(${d.visualX-gw/2}px,${d.visualY-gh/2+lift}px,0) rotate(${d.angle}deg) scale(${d.scale})`;
      if(d.queued){
        const q=d.queued,{rect,cell}=d;
        const bx=q.x-rect.left,by=q.y-rect.top;
        const cc=Math.round(bx/cell-d.p.shape[0].length/2);
        const rr=Math.round(by/cell-d.p.shape.length/2);
        const ok=canPlace(d.p.shape,rr,cc);
        if(!d.last||d.last.rr!==rr||d.last.cc!==cc){
          d.last={rr,cc};preview(rr,cc,d.p.shape,ok);
          d.near=ok;
          d.ghost.classList.toggle('bf-near',ok);d.ghost.classList.toggle('bf-invalid',!ok);
        }
      }
      if(state.dragging && (Math.abs(d.targetX-d.visualX)>0.2||Math.abs(d.targetY-d.visualY)>0.2||!immediate))d.visualRAF=requestAnimationFrame(tick);
    };
    d.visualRAF=requestAnimationFrame(tick);
  }
}
function moveDrag(ev){
  if(!state.dragging)return;
  ev.preventDefault();
  updateDrag(ev,false);
}
function endDrag(ev){
  if(!state.dragging)return;
  ev.preventDefault();
  const d=state.dragging;
  // Flush the final pointer position synchronously. This removes the
  // one-frame delay that previously caused drops to use the old cell.
  updateDrag(ev,true);
  window.removeEventListener('pointermove',moveDrag);
  window.removeEventListener('pointercancel',endDrag);
  if(d.raf)cancelAnimationFrame(d.raf);
  if(d.visualRAF)cancelAnimationFrame(d.visualRAF);
  const {rr,cc}=d.last||{rr:-99,cc:-99};
  const ok=canPlace(d.p.shape,rr,cc);
  if(d.ghost.parentNode){d.ghost.classList.remove('bf-dragging','bf-near','bf-invalid');d.ghost.remove();}
  if(d.previewEls)for(const e of d.previewEls)e.classList.remove('preview-ok','preview-bad');
  state.dragging=null;
  if(ok){
    place(d.p.shape,rr,cc,d.p.color);d.p.used=true;
    state.lastPlaced={shape:d.p.shape.map(row=>row.slice()),rr,cc};
    if(state.sound)tone(330,.045,'triangle');
    if(state.vibration)vibrate(8);
    finishMove();
  }
}
function vibrate(v){try{if(navigator.vibrate)navigator.vibrate(v)}catch(e){}}
function ensureAudio(){
  if(!audioCtx)try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(audioCtx?.state==="suspended")audioCtx.resume();
}
function tone(freq,dur,type="sine"){
  if(!state.sound)return;ensureAudio();if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.07,audioCtx.currentTime+.008);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
  o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+.02);
}
function toast(t){const x=$("#toast");x.textContent=t;x.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove("show"),900)}
function burst(n){
  const fx=$("#fx"),rect=$("#board").getBoundingClientRect();

    e.style.width=(3+Math.random()*7)+"px";e.style.height=(3+Math.random()*7)+"px";

    fx.appendChild(e);setTimeout(()=>e.remove(),850);
  }
}

  $$('#bfBoosters .boost-btn').forEach(btn=>btn.addEventListener('dblclick',()=>{const k=btn.dataset.bfBoost;if(fusionArmed&&fusionArmed!==k){fusion(fusionArmed,k);state.bf.boosters[k]=(state.bf.boosters[k]||0)+1;fusionArmed=null;updateBFHud()}else fusionArmed=k;toast('Fusion: выбери второй бустер')}));
  function bossWin(){state.coins+=300;addXP(200);event('👑 BOSS DEFEATED','+300 🪙 · +200 XP');state.bf.mode='classic';save();setTimeout(()=>{hideModal();resetBoard()},900)}
  function setupPuzzle(){state.board=Array.from({length:state.size},()=>Array(state.size).fill(null));state.obstacles=Array.from({length:state.size},()=>Array(state.size).fill(null));state.gems=Array.from({length:state.size},()=>Array(state.size).fill(false));state.bf.special=Array.from({length:state.size},()=>Array(state.size).fill(null));for(let i=0;i<Math.min(10,state.size*2);i++){const r=Math.floor(Math.random()*state.size),c=Math.floor(Math.random()*state.size);state.board[r][c]=rand(colors)}render();event('🧩 PUZZLE','Заполни поле и очисти 3 линии')}
  function checkAchievements(){
    achievement('combo5','Комбо ×5',100,()=>state.bf.comboBest>=5);achievement('combo10','Комбо ×10',250,()=>state.bf.comboBest>=10);achievement('clear50','50 линий',150,()=>state.bf.totalClears>=50);achievement('move100','100 ходов',200,()=>state.bf.totalMoves>=100);achievement('gem10','10 кристаллов',200,()=>state.bf.gems>=10);achievement('fusion5','5 Fusion',250,()=>state.bf.fusions>=5);achievement('perfect3','3 Perfect',250,()=>state.bf.perfects>=3);achievement('booster10','10 бустеров',200,()=>state.bf.totalBoosters>=10)}
  function progressModal(){const ach=[['combo5','🔥 ×5'],['combo10','🔥 ×10'],['clear50','🧹 50 линий'],['move100','🎯 100 ходов'],['gem10','💎 10 кристаллов'],['fusion5','🧬 5 Fusion'],['perfect3','✨ 3 Perfect'],['booster10','🛠 10 бустеров']];showModal(`<h2>🏆 Прогресс</h2><div class="bf-grid2"><div class="bf-card"><b>Уровень ${state.bf.level}</b><small>${state.bf.xp}/${state.bf.level*100} XP</small></div><div class="bf-card"><b>Комбо ${state.bf.comboBest}</b><small>лучшее комбо</small></div><div class="bf-card"><b>${state.bf.totalClears}</b><small>линий очищено</small></div><div class="bf-card"><b>${state.bf.fusions}</b><small>Fusion</small></div></div><div class="bf-card"><b>🏅 Достижения</b><div class="bf-collection">${ach.map(a=>`<span class="bf-badge ${state.bf.ach[a[0]]?'':'lock'}">${state.bf.ach[a[0]]?'✓ ':''}${a[1]}</span>`).join('')}</div></div><div class="bf-card"><b>🎒 Коллекция</b><small>Скины и темы открываются в магазине. Редкие предметы дают уникальные эффекты.</small></div><button class="primary" id="bfClose">Готово</button>`);$('#bfClose').onclick=hideModal}
  function wheel(){const today=new Date().toISOString().slice(0,10);const rewards=[['🪙','100 монет',100],['🪙','250 монет',250],['💎','Кристальный бонус',350],['🔨','Молот',0],['🎁','Большой приз',500]];showModal(`<h2>🎡 Колесо удачи</h2><p style="color:#aab4ca">Один бесплатный спин в день.</p><div style="font-size:78px;text-align:center;animation:crateFloat 1.2s ease-in-out infinite">🎡</div><button class="primary" id="spinWheel">${state.bf.lastDaily===today?'УЖЕ КРУТИЛ':'КРУТИТЬ БЕСПЛАТНО'}</button><button class="secondary" id="closeWheel" style="margin-top:8px">Закрыть</button>`);$('#closeWheel').onclick=hideModal;$('#spinWheel').onclick=()=>{if(state.bf.lastDaily===today){toast('Возвращайся завтра');return}state.bf.lastDaily=today;const r=rand(rewards);if(r[2])state.coins+=r[2];else state.bf.boosters.hammer=(state.bf.boosters.hammer||0)+1;save();showModal(`<h2>🎉 ${r[0]} ${r[1]}</h2><p>Награда добавлена!</p><button class="primary" id="wheelOk">Забрать</button>`);$('#wheelOk').onclick=hideModal;burst(70);tone(1000,.2,'triangle')}}
  // Modes
  $$('#bfModeBar button').forEach(b=>b.onclick=()=>{state.bf.mode=b.dataset.bfMode;$$('#bfModeBar button').forEach(x=>x.classList.toggle('active',x===b));hideModal();resetBoard();if(state.bf.mode==='time')startTimer();event('РЕЖИМ: '+b.textContent.replace(/^\S+\s*/,''),state.bf.mode==='hardcore'?'Препятствия появляются чаще':'Удачи!');});
  let timerId=null;function startTimer(){clearInterval(timerId);state.bf.timeLeft=60;timerId=setInterval(()=>{if(state.paused||$('#game').classList.contains('hidden'))return;state.bf.timeLeft--;if(state.bf.timeLeft<=10&&state.bf.timeLeft>0)toast('⏱ '+state.bf.timeLeft);if(state.bf.timeLeft<=0){clearInterval(timerId);event('⏰ ВРЕМЯ ВЫШЛО','Результат сохранён');gameOver()}},1000)}
  // Replace game over with a richer result screen while preserving the original flow.
  const baseGameOver=gameOver;gameOver=function(){clearInterval(timerId);checkAchievements();save();showModal(`<h2>${state.bf.mode==='time'?'⏱ TIME OVER':'GAME OVER'}</h2><p>Твой результат</p><div style="font-size:42px;font-weight:950">${fmt(state.score)}</div><div class="stats"><div class="stat"><b>${fmt(best())}</b><small>BEST</small></div><div class="stat"><b>${state.bf.comboBest}</b><small>COMBO</small></div><div class="stat"><b>${state.bf.totalClears}</b><small>ЛИНИЙ</small></div><div class="stat"><b>+${Math.max(20,Math.floor(state.score/20))}</b><small>XP</small></div></div><div style="display:grid;gap:9px;margin-top:16px"><button class="primary" id="again">ИГРАТЬ СНОВА</button><button class="secondary" id="toMenu">МЕНЮ</button></div>`);$('#again').onclick=()=>{hideModal();resetBoard()};$('#toMenu').onclick=()=>{hideModal();showMenu()};if(state.score>best()){setBest(state.score);toast('NEW RECORD!');burst(90)}};
  // Reset daily reward by date for the existing shop.
  const day=new Date().toISOString().slice(0,10);if(saved.dailyDate!==day){saved.dailyDate=day;saved.dailyClaimed=false;save()}
  // Extra menu buttons.
  $('#bfProgressBtn').onclick=progressModal;$('#bfWheelBtn').onclick=wheel;
  // Make game mode visible and initialize.
  const oldStart=startGame;startGame=function(){oldStart();setTimeout(()=>{$$('#bfModeBar button').forEach(b=>b.classList.toggle('active',b.dataset.bfMode===state.bf.mode));updateBFHud()},30)};
  updateBFHud();
})();

</script>

<style>

.bfc .shoe{position:absolute;z-index:2;top:120px;width:24px;height:11px;border-radius:9px 11px 5px 5px;background:var(--shoe)}.bfc .shoe.l{left:18px}.bfc .shoe.r{right:18px}
.bfc.accessory-cap .cap{display:block}.bfc .cap{display:none;position:absolute;z-index:8;left:17px;top:-5px;width:57px;height:22px;border-radius:30px 30px 8px 8px;background:var(--shirt);box-shadow:inset 0 -5px rgba(0,0,0,.12)}
.bfc.accessory-glasses .glasses{display:block}.bfc .glasses{display:none;position:absolute;z-index:9;left:28px;top:23px;width:34px;height:10px}.bfc .glasses:before,.bfc .glasses:after{content:"";position:absolute;width:12px;height:8px;border:2px solid #151b2c;border-radius:4px}.bfc .glasses:before{left:0}.bfc .glasses:after{right:0}.bfc .glasses i{position:absolute;left:12px;top:3px;width:10px;border-top:2px solid #151b2c}
.bfc.female .body{border-radius:19px 19px 16px 16px}.bfc.female .hair{height:43px;width:58px;left:18px;top:0;border-radius:50% 50% 45% 45%;clip-path:none}.bfc.female .hair:after{content:"";position:absolute;left:-2px;top:18px;width:14px;height:46px;border-radius:12px;background:var(--hair);box-shadow:48px 0 var(--hair)}
.bfc.reaction-idle{animation:bfcBreath 2.6s ease-in-out infinite}.bfc.reaction-good{animation:bfcHappy .62s cubic-bezier(.2,1.5,.4,1)}.bfc.reaction-combo{animation:bfcCombo .72s cubic-bezier(.2,1.6,.3,1)}.bfc.reaction-big{animation:bfcBig .9s cubic-bezier(.1,1.4,.25,1)}.bfc.reaction-perfect{animation:bfcPerfect 1.05s ease}
.bfc.reaction-good .arm.l,.bfc.reaction-combo .arm.l,.bfc.reaction-big .arm.l,.bfc.reaction-perfect .arm.l{animation:bfcArmL .65s ease}.bfc.reaction-good .arm.r,.bfc.reaction-combo .arm.r,.bfc.reaction-big .arm.r,.bfc.reaction-perfect .arm.r{animation:bfcArmR .65s ease}
@keyframes bfcBreath{50%{transform:translateY(-3px)}}@keyframes bfcHappy{0%{transform:scale(1)}35%{transform:translateY(-12px) rotate(-4deg) scale(1.05)}70%{transform:translateY(1px) rotate(3deg)}100%{transform:none}}@keyframes bfcCombo{0%{transform:scale(1)}35%{transform:translateY(-18px) rotate(-7deg) scale(1.08)}65%{transform:translateY(2px) rotate(5deg) scale(1.03)}100%{transform:none}}@keyframes bfcBig{0%{transform:scale(1)}25%{transform:translateY(-25px) rotate(-9deg) scale(1.12)}55%{transform:translateY(0) rotate(7deg) scale(1.05)}100%{transform:none}}@keyframes bfcPerfect{0%{transform:scale(1)}20%{transform:translateY(-28px) rotate(-12deg) scale(1.15)}42%{transform:translateY(-4px) rotate(10deg) scale(1.08)}65%{transform:translateY(-18px) rotate(-5deg) scale(1.1)}100%{transform:none}}@keyframes bfcArmL{50%{transform:rotate(-65deg) translateY(-5px)}}@keyframes bfcArmR{50%{transform:rotate(62deg) translateY(-5px)}}
.bfc-bubble{position:absolute;left:50%;top:-4px;transform:translateX(-50%) translateY(-8px);padding:7px 12px;border-radius:15px;background:rgba(14,20,38,.92);border:1px solid rgba(255,255,255,.13);font-weight:950;font-size:12px;white-space:nowrap;opacity:0;transition:.18s;z-index:20;pointer-events:none}.bfc-bubble.show{opacity:1;transform:translateX(-50%) translateY(-18px)}
.bfc-name{font-size:11px;font-weight:900;color:#aab4ca;text-align:center;margin-top:-2px}.bfc-custom-btn{pointer-events:auto;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-weight:900;font-size:11px}
.bfc-shop{display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:left}.bfc-item{padding:10px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)}.bfc-item b{display:block}.bfc-item small{display:block;color:#aab4ca;margin:3px 0 7px}.bfc-item button{width:100%;padding:8px;border-radius:10px;background:rgba(124,92,255,.55);font-weight:900}.bfc-item button.owned{background:rgba(78,230,165,.18)}.bfc-tabs{display:flex;gap:6px;margin:8px 0 12px}.bfc-tabs button{flex:1;padding:8px;border-radius:10px;background:rgba(255,255,255,.06)}.bfc-tabs button.active{background:linear-gradient(135deg,rgba(124,92,255,.7),rgba(95,240,193,.3))}

</style>
<script>
(function(){
  const KEY='blockFusionCharacterV1';
  const old=JSON.parse(localStorage.getItem(KEY)||'{}');
  const C={gender:old.gender||'male',skin:old.skin||'skin1',hair:old.hair||'hair1',shirt:old.shirt||'shirt1',pants:old.pants||'pants1',accessory:old.accessory||'none',name:old.name||'Fusion'};
  const skins={skin1:['#f2c29b','Светлая'],skin2:['#c98c62','Тёплая'],skin3:['#8f5b3e','Тёмная']};
  const hairs={hair1:['#3a2419','Классика'],hair2:['#1d2430','Тёмные'],hair3:['#d89a3f','Золотые'],hair4:['#9a5cff','Фиолетовые']};
  const shirts={shirt1:['#7c5cff','Fusion'],shirt2:['#35b8a0','Mint'],shirt3:['#ff647c','Red'],shirt4:['#f0b84d','Gold']};
  const pants={pants1:['#27324d','Night'],pants2:['#18202d','Black'],pants3:['#38516e','Blue']};
  const accessories={none:['','Без аксессуара',0],cap:['cap','Кепка',180],glasses:['glasses','Очки',220]};
  const prices={skin1:0,skin2:250,skin3:450,hair1:0,hair2:180,hair3:220,hair4:350,shirt1:0,shirt2:180,shirt3:250,shirt4:400,pants1:0,pants2:160,pants3:200};
  const owned=new Set(old.owned||['skin1','hair1','shirt1','pants1','none']);
  function saveChar(){localStorage.setItem(KEY,JSON.stringify({...C,owned:[...owned]})); if(typeof saveShop==='function')try{saveShop()}catch(e){} }
  function ensureDock(){
    if($('#bfCharacterDock'))return;
    const game=$('#game'); if(!game)return;
    const boardWrap=game.querySelector('.board-wrap');
    const dock=document.createElement('div');dock.id='bfCharacterDock';
    dock.innerHTML='<div class="bfc-stage"><div class="bfc-glow"></div><div id="bfcBubble" class="bfc-bubble"></div><div id="bfcAvatar" class="bfc reaction-idle"><span class="cap"></span><span class="head"><i class="ear l"></i><i class="ear r"></i><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></span><span class="hair"></span><span class="glasses"><i></i></span><span class="neck"></span><span class="body"></span><span class="arm l"></span><span class="arm r"></span><span class="hand l"></span><span class="hand r"></span><span class="leg l"></span><span class="leg r"></span><span class="shoe l"></span><span class="shoe r"></span></div></div><div><div id="bfcName" class="bfc-name"></div><button id="bfcCustomize" class="bfc-custom-btn">👤 Кастомизация</button></div>';
    boardWrap.insertAdjacentElement('afterend',dock);
    $('#bfcCustomize').onclick=openShop;
    renderAvatar();
  }
  function renderAvatar(){
    ensureDock();const a=$('#bfcAvatar');if(!a)return;
    const sk=skins[C.skin]||skins.skin1,ha=hairs[C.hair]||hairs.hair1,sh=shirts[C.shirt]||shirts.shirt1,pa=pants[C.pants]||pants.pants1;
    a.className='bfc '+(C.gender==='female'?'female ':'')+'reaction-idle '+(C.accessory==='cap'?'accessory-cap ':'')+(C.accessory==='glasses'?'accessory-glasses':'');
    a.style.setProperty('--skin',sk[0]);a.style.setProperty('--hair',ha[0]);a.style.setProperty('--shirt',sh[0]);a.style.setProperty('--pants',pa[0]);a.style.setProperty('--shoe','#151b2c');
    $('#bfcName').textContent=`${C.name} · ${C.gender==='male'?'Мужской':'Женский'}`;
  }
  function react(combo,kind){
    ensureDock();const a=$('#bfcAvatar'),b=$('#bfcBubble');if(!a)return;
    let cls='reaction-good',msg='👍 Хорошо!';
    if(kind==='perfect'||combo>=8){cls='reaction-perfect';msg='🔥 НЕВЕРОЯТНО!';}
    else if(combo>=5){cls='reaction-big';msg='👑 ОГО! ×'+combo;}
    else if(combo>=2){cls='reaction-combo';msg='⚡ COMBO ×'+combo;}
    a.classList.remove('reaction-idle','reaction-good','reaction-combo','reaction-big','reaction-perfect');void a.offsetWidth;a.classList.add(cls);
    b.textContent=msg;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),900);
    if(typeof burst==='function'&&combo>=3)burst(combo>=7?35:18);
    setTimeout(()=>{a.classList.remove(cls);a.classList.add('reaction-idle')},1050);
  }
  function ownedOrBuy(id){
    if(owned.has(id))return true;
    const price=prices[id]??accessories[id]?.[2]??0;
    if(state.coins<price){toast('Нужно больше монет 🪙');return false}
    state.coins-=price;owned.add(id);saveChar();updateHud();toast('Куплено!');return true;
  }
  function setPart(cat,id){
    if(!ownedOrBuy(id))return;
    C[cat]=id;saveChar();renderAvatar();openShop();
  }
  function genderPick(g){C.gender=g;saveChar();renderAvatar();openShop();}
  function section(title,items,cat){return `<div class="bf-card"><b>${title}</b><div class="bfc-shop">${items.map(([id,label])=>{const price=prices[id]||0;const on=owned.has(id);const eq=C[cat]===id;return `<div class="bfc-item"><b>${label}</b><small>${eq?'Надето':on?'Куплено':price+' 🪙'}</small><button class="${eq?'owned':''}" data-char-cat="${cat}" data-char-id="${id}">${eq?'✓ Надето':on?'Надеть':price?'Купить':'Бесплатно'}</button></div>`}).join('')}</div></div>`}
  function openShop(){
    showModal(`<h2>👤 Персонаж</h2><p style="color:#aab4ca">Персонаж реагирует на твои комбо прямо возле поля.</p><div class="bfc-tabs"><button id="cgM" class="${C.gender==='male'?'active':''}">♂ Мужской</button><button id="cgF" class="${C.gender==='female'?'active':''}">♀ Женский</button></div>${section('🎨 Кожа',Object.entries(skins).map(([k,v])=>[k,v[1]]),'skin')}${section('💇 Волосы',Object.entries(hairs).map(([k,v])=>[k,v[1]]),'hair')}${section('👕 Одежда',Object.entries(shirts).map(([k,v])=>[k,v[1]]),'shirt')}${section('👖 Брюки',Object.entries(pants).map(([k,v])=>[k,v[1]]),'pants')}<div class="bf-card"><b>✨ Аксессуары</b><div class="bfc-shop">${Object.entries(accessories).map(([id,v])=>{const eq=C.accessory===id,on=owned.has(id),price=v[2];return `<div class="bfc-item"><b>${v[1]}</b><small>${eq?'Надето':on?'Куплено':price+' 🪙'}</small><button class="${eq?'owned':''}" data-char-acc="${id}">${eq?'✓ Надето':on?'Надеть':price?'Купить':'Бесплатно'}</button></div>`}).join('')}</div></div><button class="primary" id="bfcDone">Готово</button>`);
    $('#cgM').onclick=()=>genderPick('male');$('#cgF').onclick=()=>genderPick('female');
    $$('#modal [data-char-cat]').forEach(x=>x.onclick=()=>setPart(x.dataset.charCat,x.dataset.charId));
    $$('#modal [data-char-acc]').forEach(x=>x.onclick=()=>{const id=x.dataset.charAcc;if(!ownedOrBuy(id))return;C.accessory=id;saveChar();renderAvatar();openShop()});
    $('#bfcDone').onclick=hideModal;
  }
  const oldStartGame=window.startGame;
  window.startGame=function(){oldStartGame.apply(this,arguments);setTimeout(ensureDock,20)};
  const oldShowMenu=window.showMenu;
  window.showMenu=function(){oldShowMenu.apply(this,arguments);setTimeout(()=>{if($('#bfCharacterDock'))$('#bfCharacterDock').remove()},20)};
  if(window.finishMove){const oldFinish=window.finishMove;window.finishMove=function(){const before=state.combo;oldFinish.apply(this,arguments);setTimeout(()=>{const c=state.combo;if(c>=2)react(c);else if(before===0)react(1)},90)}}
  // Character button in the main menu.
  const menuCard=document.querySelector('.menu-card');if(menuCard&&!$('#bfcMenuBtn')){const b=document.createElement('button');b.id='bfcMenuBtn';b.className='secondary';b.style.cssText='width:100%;margin-top:8px';b.textContent='👤 Персонаж';b.onclick=openShop;menuCard.appendChild(b)}
  ensureDock();renderAvatar();
})();
</script>

<script id="bf-v2-script">
(function(){
  const KEY='blockFusionCharacterV2';
  let D={}; try{D=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  const v1=(()=>{try{return JSON.parse(localStorage.getItem('blockFusionCharacterV1')||'{}')}catch(e){return {}}})();
  const rarity={common:{name:'Обычная',mult:1},rare:{name:'Редкая',mult:1.7},epic:{name:'Эпическая',mult:3},legendary:{name:'Легендарная',mult:6},mythic:{name:'Мифическая',mult:12}};
  const items={

    pants4:['Карго','rare',380,'👖','pants'],pants5:['Спорт','common',180,'🩳','pants'],pants6:['Самурай','legendary',1250,'🥋','pants'],pants7:['Неоновые','epic',780,'👖','pants'],
    hair5:['Мята','rare',480,'💇','hair'],hair6:['Огонь','epic',850,'🔥','hair'],hair7:['Кибер','legendary',1550,'🤖','hair'],hair8:['Кристалл','mythic',3600,'💎','hair'],
    acc3:['Наушники','rare',560,'🎧','accessory'],acc4:['Цепь','epic',820,'⛓️','accessory'],acc5:['Корона','legendary',2200,'👑','accessory'],acc6:['Рога','mythic',4200,'😈','accessory'],acc7:['Рюкзак','common',260,'🎒','accessory'],
    shoe1:['Кроссовки','common',120,'👟','shoe'],shoe2:['Неоновые кроссовки','epic',720,'👟','shoe'],shoe3:['Золотые ботинки','legendary',1900,'🥾','shoe']
  };
  const effects={none:['Без эффекта','common',0,'✨'],fire:['Огненная аура','rare',500,'🔥'],lightning:['Молния','epic',900,'⚡'],snow:['Снег','rare',650,'❄️'],rainbow:['Радуга','legendary',1800,'🌈'],crystal:['Кристалл','mythic',4200,'💎']};
  const emotes={happy:['😎','Уверенный',common=0],laugh:['😂','Смех',300],cool:['😎','Cool',550],dance:['💃','Танец',900],victory:['🏆','Победа',1400],fire:['🔥','Огонь',2200]};
  const seasons=['Cyber City','Space','Samurai','Winter','Future'];
  const defaults={level:1,xp:0,crystals:0,owned:[],equipped:{shirt:null,pants:null,hair:null,accessory:null,shoe:null,effect:'none',emote:'happy'},quests:{moves:0,clears:0,combo:0},season:0,lastGift:0};
  const S=Object.assign({},defaults,D); S.equipped=Object.assign({},defaults.equipped,D.equipped||{}); S.quests=Object.assign({},defaults.quests,D.quests||{}); S.owned=[...new Set([...(D.owned||[]),...(v1.owned||[])])];
  const owned=new Set(S.owned);
  function save(){S.owned=[...owned];localStorage.setItem(KEY,JSON.stringify(S));}
  function coins(){return typeof state!=='undefined'&&typeof state.coins==='number'?state.coins:0}
  function spend(n){if(coins()<n){toast('Нужно больше монет 🪙');return false}state.coins-=n;if(typeof saveShop==='function')try{saveShop()}catch(e){};if(typeof updateHud==='function')updateHud();return true}
  function buy(id,price){if(owned.has(id))return true;if(!spend(price))return false;owned.add(id);save();toast('Получено: '+(items[id]?.[0]||effects[id]?.[0]||emotes[id]?.[1]||id));return true}
  function xpNeed(){return 100+(S.level-1)*60}
  function addXP(n){S.xp+=n;while(S.xp>=xpNeed()){S.xp-=xpNeed();S.level++;if(S.level%5===0){S.crystals+=20;toast('✨ Новый уровень! +20 кристаллов')}else toast('⭐ Уровень '+S.level)}save()}
  function el(id){return document.getElementById(id)}
  function applyVisual(){
    const a=el('bfcAvatar');if(!a)return;
    let box=el('bfv2Layers');if(!box){box=document.createElement('div');box.id='bfv2Layers';box.innerHTML='<span class="bfv2-aura"></span><span class="bfv2-layer bfv2-hat"></span><span class="bfv2-layer bfv2-back"></span><span class="bfv2-layer bfv2-face"></span><span class="bfv2-layer bfv2-neck"></span><span class="bfv2-layer bfv2-shoes"></span>';a.appendChild(box)}
    const [shirt]=[S.equipped.shirt];const [pants]=[S.equipped.pants];const [hair]=[S.equipped.hair];const acc=S.equipped.accessory;const shoe=S.equipped.shoe;const eff=S.equipped.effect||'none';
    const txt=id=>items[id]?.[3]||'';
    box.querySelector('.bfv2-hat').textContent=(hair&&['hair7','hair8'].includes(hair))?txt(hair):'';
    box.querySelector('.bfv2-back').textContent=acc==='acc7'?'🎒':'';
    box.querySelector('.bfv2-face').textContent=acc==='acc6'?'😈':acc==='acc5'?'👑':acc==='acc3'?'🎧':acc==='acc4'?'⛓️':'';
    box.querySelector('.bfv2-neck').textContent=shirt==='shirt8'||pants==='pants6'?'🧣':acc==='acc4'?'⛓️':'';
    box.querySelector('.bfv2-shoes').textContent=shoe?txt(shoe):'';
    const aura=box.querySelector('.bfv2-aura');aura.className='bfv2-aura '+eff;
    if(eff==='rainbow'||eff==='crystal')a.classList.add('bfv2-outfit-halo');else a.classList.remove('bfv2-outfit-halo');
  }
  function animate(cls,msg){const a=el('bfcAvatar');if(!a)return; a.classList.remove('bfv2-emote','bfv2-dance','bfv2-loss','bfv2-record','bfv2-sleep');void a.offsetWidth;a.classList.add(cls);const b=el('bfcBubble');if(b){b.textContent=msg;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),1100)} if(S.equipped.effect&&S.equipped.effect!=='none')particles();setTimeout(()=>a.classList.remove(cls),1300)}
  function particles(){const a=el('bfcAvatar');if(!a)return;const icon=effects[S.equipped.effect]?.[3]||'✨';for(let i=0;i<7;i++){const p=document.createElement('span');p.className='bfv2-particle';p.textContent=icon;p.style.setProperty('--dx',((Math.random()*90)-45)+'px');a.appendChild(p);setTimeout(()=>p.remove(),1250)}}
  function questMove(){S.quests.moves++;if(S.quests.moves===10){S.crystals+=10;toast('🎁 Квест: +10 кристаллов')}save()}
  function questClear(n){S.quests.clears+=n;if(S.quests.clears>=20){S.quests.clears=0;S.crystals+=15;toast('🎁 Квест очисток выполнен! +15 кристаллов')}save()}
  function questCombo(c){S.quests.combo=Math.max(S.quests.combo,c);save()}
  function chest(type){const cfg={common:[150,'📦',.7],rare:[450,'🎁',.55],epic:[1000,'🧰',.35],legendary:[2200,'👑',.18]}[type];if(!cfg)return;if(!spend(cfg[0]))return;let pool=Object.keys(items).filter(id=>rarity[items[id][1]]);let eligible=pool.filter(id=>{const r=items[id][1];return type==='common'||(type==='rare'&&r!=='common')||(type==='epic'&&['epic','legendary','mythic'].includes(r))||(type==='legendary'&&['legendary','mythic'].includes(r))});if(!eligible.length)eligible=pool;const id=eligible[Math.floor(Math.random()*eligible.length)];owned.add(id);const extra=Math.floor(50+Math.random()*300);state.coins+=extra;addXP(35);save();toast('🎉 Сундук: '+items[id][3]+' '+items[id][0]+' + '+extra+' 🪙');openV2('chests')}
  function itemCard(id,cat){const d=items[id],r=rarity[d[1]],eq=S.equipped[cat]===id,on=owned.has(id),price=d[2];return `<div class="bfv2-item"><b>${d[3]} ${d[0]}</b><span class="bfv2-rarity bfv2-${d[1]}">${r.name}</span><small>${eq?'Надето':on?'Открыто':price+' 🪙'}</small><button class="${eq?'on':''}" data-equip="${id}" data-cat="${cat}">${eq?'✓ Надето':on?'Надеть':price+' 🪙'}</button></div>`}
  function openV2(tab='wardrobe'){
    applyVisual();
    const nav=['wardrobe','chests','effects','progress'];
    let body='';
    if(tab==='wardrobe'){
      const groups=[['👕 Верх',Object.keys(items).filter(x=>items[x][4]==='shirt'),'shirt'],['👖 Низ',Object.keys(items).filter(x=>items[x][4]==='pants'),'pants'],['💇 Волосы',Object.keys(items).filter(x=>items[x][4]==='hair'),'hair'],['🎒 Аксессуары',Object.keys(items).filter(x=>items[x][4]==='accessory'),'accessory'],['👟 Обувь',Object.keys(items).filter(x=>items[x][4]==='shoe'),'shoe']];
      body=groups.map(g=>`<div class="bfv2-card"><h4>${g[0]}</h4><div class="bfv2-grid">${g[1].map(id=>itemCard(id,g[2])).join('')}</div></div>`).join('');
    }else if(tab==='chests'){
      body=`<div class="bfv2-card"><h4>🎁 Сундуки</h4><p style="color:#aab4ca;margin-top:0">Сундук даёт случайный предмет, монеты и XP. Чем выше редкость — тем дороже.</p><div class="bfv2-grid">${[['common','📦','Обычный',150],['rare','🎁','Редкий',450],['epic','🧰','Эпический',1000],['legendary','👑','Легендарный',2200]].map(x=>`<div class="bfv2-chest"><div class="ico">${x[1]}</div><b>${x[2]}</b><small>${x[3]} 🪙</small><button class="primary" data-chest="${x[0]}">Открыть</button></div>`).join('')}</div></div>`;
    }else if(tab==='effects'){
      body=`<div class="bfv2-card"><h4>✨ Эффекты персонажа</h4><div class="bfv2-grid">${Object.entries(effects).map(([id,d])=>{const on=owned.has(id)||id==='none',eq=S.equipped.effect===id;return `<div class="bfv2-item"><div class="bfv2-effect">${d[3]}</div><b>${d[0]}</b><span class="bfv2-rarity bfv2-${d[1]}">${rarity[d[1]].name}</span><small>${eq?'Включён':on?'Открыт':d[2]+' 🪙'}</small><button class="${eq?'on':''}" data-effect="${id}">${eq?'✓ Включён':on?'Включить':d[2]+' 🪙'}</button></div>`}).join('')}</div></div><div class="bfv2-card"><h4>😊 Эмоции</h4><div class="bfv2-grid">${Object.entries(emotes).map(([id,d])=>{const on=owned.has('emote:'+id)||id==='happy',eq=S.equipped.emote===id;return `<div class="bfv2-item"><div class="bfv2-effect">${d[0]}</div><b>${d[1]}</b><small>${eq?'Выбрано':on?'Открыто':d[2]+' 🪙'}</small><button class="${eq?'on':''}" data-emote="${id}">${eq?'✓ Выбрано':on?'Выбрать':d[2]+' 🪙'}</button></div>`}).join('')}</div></div>`;
    }else{
      const need=xpNeed(),pct=Math.min(100,S.xp/need*100),total=Object.keys(items).length+Object.keys(effects).length+Object.keys(emotes).length;
      const collected=Object.keys(items).filter(x=>owned.has(x)).length+Object.keys(effects).filter(x=>owned.has(x)||x==='none').length+Object.keys(emotes).filter(x=>owned.has('emote:'+x)||x==='happy').length;
      body=`<div class="bfv2-card"><h4>⭐ Прогресс персонажа</h4><div class="bfv2-stat"><span>Уровень</span><b>${S.level}/50</b></div><div class="bfv2-progress"><i style="width:${pct}%"></i></div><small>${S.xp} / ${need} XP до следующего уровня</small><div class="bfv2-stat"><span>💎 Кристаллы</span><b>${S.crystals}</b></div><div class="bfv2-stat"><span>📚 Коллекция</span><b>${collected}/${total}</b></div><div class="bfv2-stat"><span>🏃 Ходов</span><b>${S.quests.moves}/10</b></div><div class="bfv2-stat"><span>🧹 Очисток</span><b>${S.quests.clears}/20</b></div><div class="bfv2-stat"><span>🔥 Лучшее комбо</span><b>×${S.quests.combo}</b></div></div><div class="bfv2-card"><h4>🌌 Сезон</h4><p style="margin:0">${seasons[S.season%seasons.length]}</p><button class="primary" id="bfv2Season">Следующий сезон</button></div>`;
    }

    $$('#modal [data-v2tab]').forEach(b=>b.onclick=()=>openV2(b.dataset.v2tab));
    $$('#modal [data-equip]').forEach(b=>b.onclick=()=>{const id=b.dataset.equip,cat=b.dataset.cat,d=items[id];if(!owned.has(id)&&!buy(id,d[2]))return;S.equipped[cat]=id;save();applyVisual();openV2('wardrobe')});
    $$('#modal [data-chest]').forEach(b=>b.onclick=()=>chest(b.dataset.chest));
    $$('#modal [data-effect]').forEach(b=>b.onclick=()=>{const id=b.dataset.effect,d=effects[id];if(!owned.has(id)&&id!=='none'&&!buy(id,d[2]))return;S.equipped.effect=id;save();applyVisual();openV2('effects')});
    $$('#modal [data-emote]').forEach(b=>b.onclick=()=>{const id=b.dataset.emote,d=emotes[id],key='emote:'+id;if(!owned.has(key)&&id!=='happy'){if(!buy(key,d[2]))return}S.equipped.emote=id;save();openV2('effects')});
    if(el('bfv2Season'))el('bfv2Season').onclick=()=>{S.season++;save();openV2('progress')};
    el('bfv2Close').onclick=hideModal;
  }
  function hook(){

  }

  // Existing game hooks: reward character XP and reactions without replacing the original systems.
  if(window.finishMove&&!window.__bfv2hook){window.__bfv2hook=true;const old=window.finishMove;window.finishMove=function(){const before=state.combo||0;old.apply(this,arguments);setTimeout(()=>{const c=state.combo||0;questMove();addXP(4);if(c>0){questCombo(c);addXP(Math.min(25,c*3));if(c>=8)animate('bfv2-record','🏆 РЕКОРД!');else if(c>=5)animate('bfv2-dance','💃 ТАНЦУЕМ!');else if(c>=3)animate('bfv2-emote','⚡ Красиво!')}else if(before===0)animate('bfv2-emote',S.equipped.emote==='dance'?'💃':'😎');applyVisual()},100)}}

  let lastClears=0;setInterval(()=>{try{const n=state.totalClears||0;if(n>lastClears){questClear(n-lastClears);lastClears=n}}catch(e){}},700);
})();

 function petHTML(){return Object.entries(pets).map(([id,p])=>'<div class="bfu-pet"><div class="peticon">'+p[0]+'</div><div style="flex:1"><b>'+p[1]+'</b><small style="display:block;color:#aab4ca">'+(id==='none'?'Без питомца':p[2]+' 🪙')+'</small></div><button data-pet="'+id+'">'+(U.pet===id?'✓ Надет':id==='none'?'Выбрать':(U['pet_'+id]?'Надеть':'Купить'))+'</button></div>').join('')}
 function petsTab(){return '<div class="bfu-card"><h4>🐾 Питомцы</h4>'+petHTML()+'</div>'}
 function worldTab(){return '<div class="bfu-card"><h4>🌎 Карта миров</h4><p style="color:#aab4ca;margin:0 0 8px">Мир '+(U.world+1)+' из '+worlds.length+'</p><div class="bfu-grid">'+worlds.map((w,i)=>'<div class="bfu-world"><span class="emoji">'+w[0]+'</span><b>'+w[1]+'</b><small>'+w[2]+'</small><span class="bfu-chip">'+w[3]+'</span><button data-world="'+i+'" style="margin-top:6px">'+(i===U.world?'▶ Играть':unlocked(i)?'↻ Открыть':'🔒 Ур. '+(i*5))+'</button></div>').join('')+'</div></div>'}
 function roomTab(){const r=U.room;return '<div class="bfu-card"><h4>🏠 Моя комната</h4><div class="bfu-room"><span class="item" style="left:18px;bottom:43px">'+(r.bed?'🛏️':'')+'</span><span class="item" style="right:18px;bottom:42px">'+(r.desk?'🖥️':'')+'</span><span class="item" style="left:46%;bottom:38px">'+(r.tv?'📺':'')+'</span><span class="item" style="left:72%;bottom:40px">'+(r.plant?'🪴':'')+'</span><span class="item" style="left:40%;bottom:42px">'+(r.console?'🎮':'')+'</span><span class="item" style="right:43%;top:20px">'+(r.trophy?'🏆':'🖼️')+'</span><div class="floor"></div></div><div class="bfu-grid" style="margin-top:8px">'+[['tv','📺 Телевизор',300],['plant','🪴 Растение',250],['console','🎮 Консоль',700],['trophy','🏆 Витрина',1200]].map(x=>'<div class="bfu-card"><b>'+x[1]+'</b><small style="display:block;color:#aab4ca">'+(r[x[0]]?'Установлено':x[2]+' 🪙')+'</small><button data-room="'+x[0]+'">'+(r[x[0]]?'Установлено': 'Купить')+'</button></div>').join('')+'</div></div>'}
 function trophyTab(){return '<div class="bfu-card"><h4>🏆 Трофеи</h4><div class="bfu-grid">'+trophies.map(t=>'<div class="bfu-trophy"><span style="font-size:27px">'+(U.trophies.includes(t[0])?t[1]:'🔒')+'</span><div><b>'+t[2]+'</b><small style="display:block;color:#aab4ca">'+t[3]+'</small></div></div>').join('')+'</div></div>'}
 function modeTab(){const modes=[['classic','🧩 Classic','Без ограничений'],['time','⏱️ Time Attack','Очки за скорость'],['endless','♾️ Endless','Продержись как можно дольше'],['hardcore','💀 Hardcore','Жёсткие препятствия'],['puzzle','🧠 Puzzle','Решай заданные ситуации'],['boss','👑 Boss','Сразись с боссом']];return '<div class="bfu-card"><h4>🎮 Режимы</h4><div class="bfu-grid">'+modes.map(m=>'<div class="bfu-world"><b>'+m[1]+'</b><small>'+m[2]+'</small><button data-mode="'+m[0]+'">'+(U.mode===m[0]?'✓ Выбран':'Выбрать')+'</button></div>').join('')+'</div></div>'}
 function bossTab(){const b=U.boss;return '<div class="bfu-boss"><h4>👑 Босс: Lava Core</h4><p style="color:#aab4ca">Каждая очищенная линия наносит урон. Комбо наносит дополнительный урон.</p><div class="bfu-hp"><i style="width:'+(100*b.hp/b.max)+'%"></i></div><div class="bfu-stat"><span>HP</span><b>'+b.hp+' / '+b.max+'</b></div><button id="bfuBossReset">🔄 Новый бой</button></div><div class="bfu-card"><b>Награда за победу</b><p style="color:#aab4ca">💎 25 · 🪙 2500 · 🏆 Трофей · 🎁 Mythic Chest</p></div>'}
 function wheelTab(){return '<div class="bfu-card" style="text-align:center"><h4>🎡 Колесо удачи</h4><div id="bfuWheel" class="bfu-wheel">🎁</div><p style="color:#aab4ca">Один бесплатный запуск в день.</p><button id="bfuSpin">🎡 Крутить</button></div>'}
let audioCtx=null,musicTimer=null;
 function musicTab(){return '<div class=\"bfu-card\"><h4>🎵 Музыка</h4><p style=\"color:#aab4ca\">Процедурный саундтрек без внешних файлов.</p><button id=\"bfuMusic\">'+(U.music?'🔊 Музыка включена':'🔇 Музыка выключена')+'</button><div style=\"margin-top:10px\"><span class=\"bfu-chip\">Classic</span><span class=\"bfu-chip\">Cyber</span><span class=\"bfu-chip\">Space</span><span class=\"bfu-chip\">Samurai</span><span class=\"bfu-chip\">Lava</span></div></div>'}
 function tone(freq,dur=.12){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='triangle';g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
 function startMusic(){if(!U.music||musicTimer)return;const notes=[261.63,329.63,392,523.25,392,329.63];let i=0;tone(notes[0],.1);musicTimer=setInterval(()=>{if(U.music)tone(notes[i++%notes.length],.11);else stopMusic()},1200)}
 function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
 function open(tab='world'){login();showModal('');render(tab)}
 function unlocked(i){try{return i===0 || (typeof state!=='undefined' && state.bf && state.bf.level>=i*5)}catch(e){return i===0}}
 function render(tab){const m=document.getElementById('modal');if(!m)return;let body=tab==='world'?worldTab():tab==='pets'?petsTab():tab==='room'?roomTab():tab==='trophies'?trophyTab():tab==='modes'?modeTab():tab==='boss'?bossTab():tab==='music'?musicTab():wheelTab();m.innerHTML='<div style="max-height:80vh;overflow:auto"><h2>🌎 Block Fusion World</h2><p style="margin:0;color:#aab4ca">Мир '+(U.world+1)+' · '+worlds[U.world][1]+' · 🔥 серия '+U.dailyStreak+'</p><div class="bfu-nav">'+[['world','🌎 Миры'],['pets','🐾 Питомцы'],['room','🏠 Комната'],['trophies','🏆 Трофеи'],['modes','🎮 Режимы'],['boss','👑 Босс'],['wheel','🎡 Колесо'],['music','🎵 Музыка']].map(x=>'<button class="'+(tab===x[0]?'on':'')+'" data-u-tab="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+body+'<button class="primary" id="bfuClose" style="width:100%;margin-top:8px">Готово</button></div>';
 document.querySelectorAll('[data-u-tab]').forEach(b=>b.onclick=()=>render(b.dataset.uTab));
 document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{const i=+b.dataset.world;if(!unlocked(i)){toast('🔒 Открой этот мир, достигнув уровня '+(i*5));return}U.world=i;U.mode=worlds[i][3];save();render('world')});
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{U.mode=b.dataset.mode;save();toast('🎮 Режим выбран: '+b.dataset.mode);render('modes')});
 document.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{const id=b.dataset.pet,p=pets[id];if(id!=='none'&&!U['pet_'+id]){if(!spend(p[2]))return;U['pet_'+id]=true}U.pet=id;save();render('pets')});
 document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{const id=b.dataset.room,price={tv:300,plant:250,console:700,trophy:1200}[id];if(U.room[id])return;if(!spend(price))return;U.room[id]=true;unlockT('room');save();render('room')});
 const mus=document.getElementById('bfuMusic');if(mus)mus.onclick=()=>{U.music=!U.music;save();if(U.music)startMusic();else stopMusic();render('music')};
 const spin=document.getElementById('bfuSpin');if(spin)spin.onclick=()=>{const d=Math.floor(Date.now()/86400000);if(U.wheelLast===d){toast('🎡 Колесо уже использовано сегодня');return}U.wheelLast=d;const w=document.getElementById('bfuWheel');w.classList.add('spin');setTimeout(()=>{const rewards=[100,200,300,500,5,10,800,1500],v=rewards[Math.floor(Math.random()*rewards.length)];if(v===5||v===10){try{const k='blockFusionCharacterV2',o=JSON.parse(localStorage.getItem(k)||'{}');o.crystals=(o.crystals||0)+v;localStorage.setItem(k,JSON.stringify(o))}catch(e){}toast('💎 Вы выиграли '+v+' кристаллов')}else{addCoins(v);toast('🪙 Вы выиграли '+v+' монет')};save();render('wheel')},1200)};
 const br=document.getElementById('bfuBossReset');if(br)br.onclick=()=>{U.boss={hp:100,max:100,world:U.world,active:true};save();render('boss')};
 document.getElementById('bfuClose').onclick=hideModal;
 }
 function hookButton(){let b=document.getElementById('bfuWorldBtn');if(b)return;b=document.createElement('button');b.id='bfuWorldBtn';b.className='primary';b.textContent='🌎 Мир / Питомцы / Комната';const menu=document.querySelector('.menu-card');if(menu)menu.appendChild(b);b.onclick=()=>open('world')}
 function petRender(){let d=document.getElementById('bfuPetFloat');if(!d){d=document.createElement('div');d.id='bfuPetFloat';d.style.cssText='position:fixed;right:10px;bottom:88px;z-index:50;font-size:34px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.4));pointer-events:none;transition:transform .35s';document.body.appendChild(d)}d.textContent=pets[U.pet]?.[0]||'';d.style.transform='translateY(0)';setTimeout(()=>d.style.transform='translateY(-7px)',300);setTimeout(()=>d.style.transform='translateY(0)',650)}
 login();hookButton();petRender();if(U.music)startMusic();setTimeout(hookButton,600);setTimeout(hookButton,1800);
 const oldFinish=window.finishMove;if(oldFinish&&!window.__bfuHook){window.__bfuHook=true;window.finishMove=function(){oldFinish.apply(this,arguments);setTimeout(()=>{try{unlockT('first');const clears=state.totalClears||0,combo=state.combo||0;if(clears>=100)unlockT('lines');if(combo>=10)unlockT('combo');if((state.score||0)>=1000)unlockT('score');if(U.pet!=='none')unlockT('pet');if(U.boss.active&&U.mode==='boss'){let dmg=Math.max(1,clears%3+combo);U.boss.hp=Math.max(0,U.boss.hp-dmg);if(U.boss.hp===0){U.boss.active=false;addCoins(2500);unlockT('boss');if(U.world<worlds.length-1)U.world++;unlockT('boss');toast('👑 БОСС ПОБЕЖДЁН! +2500 🪙 · Новый мир открыт!')}save()}}catch(e){}petRender()},120)}}
 window.__bfuOpen=open;
})();
</script>

<div id="bfPolishHub" aria-hidden="true"><div class="bfp-shell"><div class="bfp-head"><div><div class="bfp-title">🌌 Block Fusion</div><div class="bfp-sub">Центр мира · прогресс · испытания</div></div><button class="bfp-close" id="bfpClose">×</button></div><div class="bfp-tabs" id="bfpTabs"></div><div class="bfp-body" id="bfpBody"></div></div></div><div class="bfp-toast" id="bfpToast"></div>
<script id="bf-polish-script">
(function(){
 const KEY='blockFusionPolishV1';
 const worlds=[
  ['🌿','Classic Valley','Классическое поле','classic','Начало путешествия'],
  ['🌆','Cyber City','Неон и энергия','time','Открой уровень 5'],
  ['🌌','Space','Космос и бесконечность','endless','Открой уровень 10'],
  ['⚔️','Samurai','Камень и сталь','hardcore','Открой уровень 15'],
  ['❄️','Ice World','Лёд и заморозка','puzzle','Открой уровень 20'],
  ['🌋','Lava Core','Финальная арена','boss','Открой уровень 25']
 ];
 let P={tab:'map',intro:true,fx:true};try{P=Object.assign(P,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
 const $=id=>document.getElementById(id);
 function save(){localStorage.setItem(KEY,JSON.stringify(P))}
 function level(){try{return state.bf?.level||state.level||1}catch(e){return 1}}
 function coins(){try{return state.coins||0}catch(e){return 0}}
 function worldUnlocked(i){return i===0||level()>=i*5}
 function toast(msg){const t=$('bfpToast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700)}
 function hide(){const h=$('bfPolishHub');h.classList.remove('show');h.setAttribute('aria-hidden','true')}
 function open(tab='map'){P.tab=tab;save();const h=$('bfPolishHub');h.classList.add('show');h.setAttribute('aria-hidden','false');render();}
 function currentWorld(){try{return JSON.parse(localStorage.getItem('blockFusionUltimateV1')||'{}').world||0}catch(e){return 0}}

/* ===== BLOCK FUSION PROCEDURAL AUDIO ===== */
(function(){
  let ac=null, master=null, musicGain=null, musicTimer=null, musicStep=0;
  const enabledKey='bfSoundEnabledV1', musicKey='bfMusicEnabledV1';
  function ensure(){
    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=.22; master.connect(ac.destination);
      musicGain=ac.createGain(); musicGain.gain.value=.055; musicGain.connect(master);
    }
    if(ac.state==='suspended') ac.resume();
  }
  function isOn(){return localStorage.getItem(enabledKey)!=='0'}
  function tone(freq,dur=.08,type='sine',vol=.12,delay=0){
    if(!isOn())return;
    try{
      ensure(); const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
      o.type=type;o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
    }catch(e){}
  }
  function noise(dur=.08,vol=.06){
    if(!isOn())return;
    try{
      ensure(); const n=ac.createBufferSource(),b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),a=b.getChannelData(0);
      for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,2);
      n.buffer=b;const g=ac.createGain();g.gain.value=vol;n.connect(g);g.connect(master);n.start();n.stop(ac.currentTime+dur);
    }catch(e){}
  }
  const S={
    place(){tone(190,.045,'triangle',.08);tone(285,.07,'sine',.06,.025)},
    clear(n=1){tone(320,.08,'triangle',.1);tone(480+n*90,.14,'sine',.1,.05); if(n>=2)tone(720+n*80,.18,'sine',.09,.11); if(n>=3)noise(.16,.07)},
    combo(n){tone(330+n*35,.09,'square',.07);tone(660+n*70,.16,'triangle',.08,.06);if(n>=10)tone(1320,.3,'sine',.1,.12)},
    record(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'sine',.09,i*.08))},
    boss(){tone(95,.3,'sawtooth',.09);tone(70,.35,'square',.06,.1)},
    chest(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.14,'triangle',.08,i*.065))},
    wheel(){tone(180,.035,'square',.05);tone(270,.045,'square',.05,.04)},
    win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'sine',.09,i*.09))},
    lose(){[392,330,262,196].forEach((f,i)=>tone(f,.2,'sine',.07,i*.09))}

  function theme(){
    let world='classic';
    try{world=window.bfWorld||window.currentWorld||'classic'}catch(e){}
    const themes={
      classic:[261.6,329.6,392,523.3],
      cyber:[220,277.2,329.6,440],
      space:[174.6,220,261.6,349.2],
      samurai:[196,246.9,293.7,392],
      ice:[293.7,369.9,440,587.3],
      lava:[130.8,164.8,196,261.6]
    };
    return themes[String(world).toLowerCase()]||themes.classic;
  }
  function musicTick(){
    if(localStorage.getItem(musicKey)==='0'||!isOn()||!musicGain)return;
    const a=theme(),f=a[musicStep%a.length];
    try{
      const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.42);
      o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+.45);
    }catch(e){}

  function startMusic(){ensure();if(musicTimer)return;musicTimer=setInterval(musicTick,500)}

/* ===== PHYSICS FEEL LAYER ===== */
(function(){
  let active=null,lastX=0,lastY=0,lastT=0,vx=0,vy=0,raf=0;
  function ring(x,y,ok){
    const r=document.createElement('div');r.className='bf-drop-ring';
    if(!ok)r.style.borderColor='rgba(255,90,110,.7)';
    r.style.left=x+'px';r.style.top=y+'px';document.body.appendChild(r);
    requestAnimationFrame(()=>r.classList.add('show'));setTimeout(()=>r.remove(),380);
  }
  function findPiece(t){
    if(!t||t.nodeType!==1)return null;
    return t.closest('.piece,.piece-wrap,.shape,.block-piece,[draggable="true"]');
  }
  function tilt(el,dx,dy){
    const angle=Math.max(-9,Math.min(9,dx*.65));
    const lift=Math.max(-18,Math.min(-7,Math.abs(dy)*-.18-8));
    const scale=1.035+Math.min(.025,Math.abs(dx)*.002);
    el.style.transform=`translateY(${lift}px) rotate(${angle}deg) scale(${scale})`;
  }
  function end(el,x,y,ok){
    if(!el)return;
    el.classList.remove('bf-lift');
    el.style.transform='';
    el.classList.add(ok?'bf-snap':'bf-reject');
    setTimeout(()=>el.classList.remove(ok?'bf-snap':'bf-reject'),320);
    ring(x,y,ok);
    active=null;
  }
  document.addEventListener('pointerdown',e=>{
    const el=findPiece(e.target); if(!el)return;
    active=el;active.classList.add('bf-physics-piece','bf-lift');
    lastX=e.clientX;lastY=e.clientY;lastT=performance.now();vx=vy=0;
  },{passive:true});
  document.addEventListener('pointermove',e=>{
    if(!active)return;
    const now=performance.now(),dt=Math.max(8,now-lastT);
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    vx=.72*vx+.28*(dx/dt*16);vy=.72*vy+.28*(dy/dt*16);
    tilt(active,vx,vy);
    lastX=e.clientX;lastY=e.clientY;lastT=now;
  },{passive:true});
  document.addEventListener('pointerup',e=>{
    if(!active)return;
    const el=active,x=e.clientX,y=e.clientY;
    // Existing game handlers decide the actual placement. We only animate the drop.
    setTimeout(()=>{
      let ok=true;
      try{
        const elRect=el.getBoundingClientRect();
        ok=elRect.width>0&&elRect.height>0;
      }catch(_){}
      end(el,x,y,ok);
    },35);
  },{passive:true});
  document.addEventListener('pointercancel',e=>{
    if(active)end(active,e.clientX||lastX,e.clientY||lastY,false);
  },{passive:true});
})();
</script><script>

    return ['crystal','neon','space','samurai','ice','lava'][worldIndex()]||'crystal';
  }
  function center(el){const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height};}
  function add(cls,x,y,css,life){
    const e=document.createElement('i');e.className=cls;e.style.left=x+'px';e.style.top=y+'px';
    if(css)Object.entries(css).forEach(([k,v])=>e.style.setProperty(k,v));
    root.appendChild(e);setTimeout(()=>e.remove(),life||800);return e;
  }
  function common(cells,kind){
    const limit=Math.min(cells.length,18);
    for(let i=0;i<limit;i++){
      const p=center(cells[i]);
      add('bf-destroy-flash',p.x,p.y,{},400);
      const n=kind==='lava'?8:kind==='neon'?6:5;
      for(let j=0;j<n;j++){
        const a=Math.random()*Math.PI*2,d=12+Math.random()*34;
        const cls=kind==='lava'?'bf-ember':kind==='neon'?'bf-neon-line':'bf-destroy-frag';
        add(cls,p.x,p.y,{
          '--dx':Math.cos(a)*d+'px','--dy':Math.sin(a)*d+'px','--rot':(Math.random()*360-180)+'deg',
          color:kind==='lava'?(['#ffdf55','#ff7a22','#ff3d00'][j%3]):kind==='neon'?(['#5ff0c1','#7c5cff','#45c8ff'][j%3]):(['#fff','#9ffcff','#8b72ff'][j%3])
        },kind==='lava'?720:kind==='neon'?520:650);
      }
    }
  }
  window.bfMaterialDestroy=function(cells,count){
    if(!cells||!cells.length)return;
    const kind=type();
    const sample=cells.slice(0,Math.min(cells.length,18));
    if(kind==='ice'){
      sample.forEach(el=>{
        const p=center(el);
        add('bf-crack',p.x,p.y,{'--rot':(Math.random()*30-15)+'deg',color:'#c9f7ff'},580);
        for(let j=0;j<4;j++){
          const a=Math.random()*Math.PI*2,d=16+Math.random()*30;
          add('bf-destroy-frag',p.x,p.y,{'--dx':Math.cos(a)*d+'px','--dy':Math.sin(a)*d+'px','--rot':(Math.random()*180)+'deg',color:'#b9f4ff'},650);
        }
      });
      return;
    }
    if(kind==='space'){
      sample.forEach(el=>{const p=center(el);add('bf-portal',p.x,p.y,{color:'#9d7cff'},700)});
      common(sample,'space'); return;
    }
    if(kind==='samurai'){
      sample.forEach((el,i)=>{const p=center(el);add('bf-slash',p.x,p.y,{color:i%2?'#ff536d':'#fff'},420)});
      common(sample,'samurai'); return;
    }
    common(sample,kind);
  };
})();
</script>

<script id="bf-integrated-gameplay">
/* ===== BLOCK FUSION INTEGRATED GAMEPLAY ===== */
(function(){

  function rankName(){return ['Bronze','Silver','Gold','Platinum','Diamond','Master'][Math.min(5,Math.floor(G.rank/5))]}

  function randomEvent(){

  let originalGameOver=null;
  function showOriginalGameOver(){if(originalGameOver)originalGameOver.apply(window,[])}
