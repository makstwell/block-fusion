    };
  }
  function enhanceGameOver(){
    if(window.__bfIntegratedGO)return;window.__bfIntegratedGO=true;
    originalGameOver=gameOver;
    window.gameOver=function(){
      if(maybeRescue())return;
      try{G.rescuedThisGame=false;rankUp();saveG()}catch(e){}
      return originalGameOver.apply(this,arguments);
    };
  }
  function enhanceFinish(){
    if(window.__bfIntegratedFinish)return;window.__bfIntegratedFinish=true;
    const old=finishMove;
    window.finishMove=function(){
      G.rescuedThisGame=false;
      const out=old.apply(this,arguments);
      setTimeout(()=>{try{if(state.combo>=3)petAbility();rankUp();saveG()}catch(e){}},70);
      return out;
    };
  }
  /* wrappers are installed after all existing game systems have initialized */
  setTimeout(()=>{try{enhanceClear();enhanceGameOver();enhanceFinish();G.rescuedThisGame=false;saveG()}catch(e){}},50);
  window.bfGameplayStats=()=>({rank:rankName(),level:G.rank,rankXp:G.rankXp,fusions:G.fusions,epics:G.epics,bestFusion:G.bestFusion,events:G.events,rescues:G.rescues});
})();
</script>

 if(id==='events'){return '<div class="bfrpg-card"><h3>🌦️ Случайные события</h3><div class="bfrpg-muted">События появляются прямо во время партии.</div><div class="bfrpg-grid"><div class="bfrpg-card">☄️ Meteor Shower<br><small>Метеоры меняют поле.</small></div><div class="bfrpg-card">💎 Crystal Rush<br><small>Больше кристаллов.</small></div><div class="bfrpg-card">🔥 Overdrive<br><small>Combo ×2.</small></div><div class="bfrpg-card">👹 Boss Invasion<br><small>Внезапная атака босса.</small></div></div><button class="bfrpg-btn bfrpg-primary" id="triggerEvent">🎲 Испытать случайное событие</button></div>'}
 return '<div class="bfrpg-card"><h3>🏆 Локальный рейтинг</h3><div class="bfrpg-muted">Только на этом устройстве.</div>'+leader().map((x,i)=>'<div class="bfrpg-item"><span class="icon">'+(['🥇','🥈','🥉'][i]||('#'+(i+1)))+'</span><div style="flex:1"><b>'+x.name+'</b><div class="bfrpg-muted">Lv.'+x.level+' · '+x.score+' очков</div></div><b>⭐ '+x.stars+'</b></div>').join('')+'</div><button class="bfrpg-btn bfrpg-primary" id="record">➕ Добавить результат</button>'}
function bind(id){let o=document.querySelector('.bfrpg-overlay');if(id==='map')o.querySelectorAll('[data-lvl]').forEach(b=>b.onclick=()=>startLevel(+b.dataset.lvl));if(id==='boss')o.querySelector('#rpgBoss').onclick=()=>startBoss(Math.min(6,Math.floor((R.level-1)/15)));if(id==='dungeon'){o.querySelector('#dunFight').onclick=()=>dungeonFight();o.querySelector('#dunReset').onclick=()=>{R.dungeon.room=1;save();open('dungeon')}}if(id==='pets')o.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>petAction(b.dataset.pet));if(id==='lab')o.querySelectorAll('[data-fuse]').forEach(b=>b.onclick=()=>synth(b.dataset.fuse));if(id==='season')o.querySelectorAll('[data-passx]').forEach(b=>b.onclick=()=>claimPass(+b.dataset.passx));if(id==='room')o.querySelectorAll('[data-furn]').forEach(b=>b.onclick=()=>buyFurn(b.dataset.furn));if(id==='events')o.querySelector('#triggerEvent').onclick=()=>triggerEvent(true);if(id==='leader')o.querySelector('#record').onclick=()=>addRecord()}
function startLevel(n){if(n>R.level)return;R.completed[n]=true;R.stars[n]=Math.max(R.stars[n]||0,1);R.level=Math.max(R.level,n+1);addSeason(40);save();toast('🗺️ Уровень '+n+' запущен');document.querySelector('.bfrpg-overlay')?.remove();if(typeof startGame==='function')startGame()}
function startBoss(w){document.querySelector('.bfrpg-overlay')?.remove();try{state.bf.mode='boss';state.bf.bossHp=400+w*350;state.bf.bossMax=state.bf.bossHp;state.bf.bossTurn=0}catch(e){}toast('👹 '+worlds[w][2]+' выходит на арену!');if(typeof startGame==='function')startGame()}
function dungeonFight(){let r=R.dungeon.room;if(r>10){giveReward('👑','Подземелье пройдено','Ты получил титул Dungeon Master!');R.dungeon.best=Math.max(R.dungeon.best,10);R.dungeon.room=1;save();return}let win=Math.random()>.18;if(win){let gain=80+r*35;giveCoins(gain);addSeason(70);R.dungeon.room++;R.dungeon.best=Math.max(R.dungeon.best,r);save();giveReward(r===10?'👑':'⚔️',r===10?'DUNGEON MASTER':'Комната '+r+' пройдена','+'+gain+' 🪙 · +70 Season XP');open('dungeon')}else{R.dungeon.room=1;save();giveReward('💥','Подземелье остановлено','Ты проиграл испытание. Прогресс комнат сброшен.')}}
function petAction(id){if(!ownedPet(id)){let cost=pets.find(p=>p[0]===id)?.[0]==='dog'?0:250;if(cost&&(!state||state.coins<cost)){toast('🪙 Не хватает монет');return}if(cost)giveCoins(-cost);R.pets[id]=1;R.petXP[id]=0;save();giveReward('🐾','Питомец разблокирован','Теперь он может эволюционировать.');open('pets');return}let before=petLevel(id);petXP(id,25);let after=petLevel(id);if(after>before&&[10,25,50].includes(after)){giveReward('✨','Эволюция! '+id.toUpperCase(),'Питомец достиг нового этапа.')}else toast('🐾 +25 XP питомцу');open('pets')}
function synth(r){if((R.lab[r]||0)<3){toast('Нужно 3 материала '+r);return}R.lab[r]-=3;let next={common:'rare',rare:'epic',epic:'legendary',legendary:'mythic'}[r];R.lab[next]=(R.lab[next]||0)+1;save();giveReward('🧬','Синтез завершён',r+' ×3 → '+next+' ×1');open('lab')}
function claimPass(n){let sl=seasonLevel();if(sl<n){toast('🔒 Нужен Battle Pass Lv.'+n);return}if(R.seasonClaimed.includes(n)){toast('Уже получено');return}R.seasonClaimed.push(n);let p=pass[n-1];giveCoins(150+n*25);save();giveReward('🎟️','Battle Pass Lv.'+n,p.reward+' · +монеты');open('season')}
function buyFurn(id){if(R.room[id])return;let f=furn.find(x=>x[0]===id);if(!f)return;if((state?.coins||0)<f[3]){toast('🪙 Не хватает монет');return}giveCoins(-f[3]);R.room[id]=true;save();toast('🏠 '+f[2]+' добавлено в комнату');open('room')}
function triggerEvent(manual){let ev=[['☄️','Meteor Shower','Поле трясётся, следующий ход даёт ×2 XP'],['💎','Crystal Rush','Ты нашёл 75 монет'],['🔥','Overdrive','Следующее комбо получает бонус'],['👹','Boss Invasion','Босс атакует поле!']][Math.floor(Math.random()*4)];R.events++;if(ev[0]==='💎')giveCoins(75);if(ev[0]==='🔥')addSeason(100);if(ev[0]==='👹')try{state.bf.bossHp=Math.max(1,(state.bf.bossHp||100)-25)}catch(e){}save();giveReward(ev[0],ev[1],ev[2]);}
function leader(){let a=[{name:'Fusion Player',level:+(state?.bf?.level||1),score:+Math.max(state?.best8||0,state?.best10||0,state?.score||0),stars:Object.values(R.stars).reduce((a,b)=>a+(+b||0),0)},...(R.leader||[])];return a.sort((a,b)=>b.score-a.score).slice(0,20)}
function addRecord(){let n=prompt('Имя игрока','Fusion Player');if(!n)return;let sc=Number(prompt('Очки',String(state?.score||0)));if(!Number.isFinite(sc))return;R.leader=(R.leader||[]).filter(x=>x.name!==n);R.leader.push({name:n.slice(0,20),level:+(state?.bf?.level||1),score:Math.max(0,sc),stars:Object.values(R.stars).reduce((a,b)=>a+(+b||0),0)});save();open('leader')}
function addMenuButton(){let card=document.querySelector('.menu-card');if(!card||document.getElementById('rpgHubBtn'))return;let b=document.createElement('button');b.id='rpgHubBtn';b.className='primary';b.style.marginTop='9px';b.textContent='🚀 RPG HUB — КАРТА · БОССЫ · ПИТОМЦЫ';b.onclick=()=>open('map');card.appendChild(b)}
function hookGameplay(){if(window.__bfrpgHooks)return;window.__bfrpgHooks=true;try{let old=window.bossWin;if(old)window.bossWin=function(){addSeason(500);R.completed[Math.max(1,Math.floor(R.level/15)*15)]=true;R.level=Math.min(100,R.level+1);save();return old.apply(this,arguments)}}catch(e){}try{let old=window.fusion;if(old)window.fusion=function(a,b){addSeason(90);R.lab.epic=(R.lab.epic||0)+1;save();return old.apply(this,arguments)}}catch(e){}setInterval(()=>{if(Math.random()<.035&&document.getElementById('game')?.classList.contains('active'))triggerEvent(false)},12000)}
setTimeout(()=>{addMenuButton();hookGameplay()},500);window.bfRPGHub=open;window.bfRPGSeason=addSeason;
})();
</script>
<script>
/* ===== FINAL GAMEPLAY MERGE: COMBO 2.0 + CHAIN ===== */
(function(){
  const comboSaved=(()=>{try{return JSON.parse(localStorage.getItem('blockFusionComboV2')||'{}')}catch(e){return {}}})();
  state.comboTier=comboSaved.comboTier||state.comboTier||0;
  state.chain=comboSaved.chain||0;
  state.chainBest=comboSaved.chainBest||0;
  function saveCombo(){try{localStorage.setItem('blockFusionComboV2',JSON.stringify({comboTier:state.comboTier||0,chain:state.chain||0,chainBest:state.chainBest||0}))}catch(e){}}
  const basePersist=window.persist;
  if(typeof basePersist==='function'&&!window.__bfFinalPersist){
    window.__bfFinalPersist=true;
    window.persist=function(){const r=basePersist.apply(this,arguments);saveCombo();return r};
  }
  function rarityFor(s){const n=s.flat().filter(Boolean).length;return n>=9?'MYTHIC':n>=7?'EPIC':n>=5?'RARE':'COMMON'}
  const baseNewPiece=window.newPiece;
  if(typeof baseNewPiece==='function'&&!window.__bfFinalPiece){
    window.__bfFinalPiece=true;
    window.newPiece=function(){const p=baseNewPiece.apply(this,arguments);p.rarity=p.rarity||rarityFor(p.shape);return p};
  }
  const baseRenderPieces=window.renderPieces;
  if(typeof baseRenderPieces==='function'&&!window.__bfFinalPiecesRender){
    window.__bfFinalPiecesRender=true;
    window.renderPieces=function(){const r=baseRenderPieces.apply(this,arguments);try{document.querySelectorAll('#pieces .piece-slot').forEach((slot,i)=>{const p=state.pieces[i];if(!p)return;slot.dataset.rarity=p.rarity||rarityFor(p.shape);if(p.rarity&&p.rarity!=='COMMON')slot.classList.add('rare-piece')})}catch(e){}return r};
  }
  const baseHud=window.updateHud;
  function ensureComboUI(){
    let m=document.getElementById('comboMeter');
    if(!m){const cb=document.getElementById('combo');if(!cb)return; m=document.createElement('div');m.id='comboMeter';m.className='combo-meter';m.innerHTML='<i id="comboFill"></i>';cb.insertAdjacentElement('afterend',m);const t=document.createElement('div');t.id='comboTier';t.className='combo-tier';m.insertAdjacentElement('afterend',t)}
    return m;
  }
  if(typeof baseHud==='function'&&!window.__bfFinalHud){
    window.__bfFinalHud=true;
    window.updateHud=function(){const r=baseHud.apply(this,arguments);try{ensureComboUI();const cb=document.getElementById('combo'),m=document.getElementById('comboMeter'),f=document.getElementById('comboFill'),t=document.getElementById('comboTier');const tier=state.combo>=8?'FUSION MASTER':state.combo>=6?'ULTRA':state.combo>=4?'EPIC':state.combo>=2?'HOT STREAK':'';if(state.combo>1){if(cb){cb.textContent='COMBO ×'+state.combo;cb.classList.add('show')}m?.classList.add('show');if(f)f.style.width=Math.min(100,((state.combo%8||8)/8)*100)+'%';if(t)t.textContent=tier+(state.chain>0?' · CHAIN ×'+state.chain:'')}else{cb?.classList.remove('show');m?.classList.remove('show');if(f)f.style.width='0%';if(t)t.textContent=''}}catch(e){}saveCombo();return r};
  }
  const baseClear=window.clearLines;
  if(typeof baseClear==='function'&&!window.__bfFinalClear){
    window.__bfFinalClear=true;
    window.clearLines=function(lines){
      const before=state.combo||0;const n=baseClear.apply(this,arguments);if(n>0){
        state.comboTier=state.combo>=8?4:state.combo>=6?3:state.combo>=4?2:state.combo>=2?1:0;
        const gain=n>=2?Math.min(3,n-1):0;
        state.chain=gain?Math.min(9,(state.chain||0)+gain):Math.max(0,(state.chain||0)-1);
        state.chainBest=Math.max(state.chainBest||0,state.chain);
        const bonus=state.chain*35;
        state.score+=bonus;
        state.coins=(state.coins||0)+bonus;
        if(state.chain>=2){const cp=document.createElement('div');cp.className='chain-pop';cp.textContent='⛓️ CHAIN ×'+state.chain+'  +'+bonus;document.body.appendChild(cp);setTimeout(()=>cp.remove(),820);if(state.sound&&typeof tone==='function')tone(760+state.chain*55,.16,'triangle');if(state.animations&&typeof burst==='function')burst(20+state.chain*8)}
        if(state.chain>=4&&typeof toast==='function')toast('🔥 CHAIN MASTER ×'+state.chain);
      }else{state.chain=Math.max(0,(state.chain||0)-1);if(before===0)state.comboTier=0}
      saveCombo();return n;
    };
  }
  const baseFinish=window.finishMove;
  if(typeof baseFinish==='function'&&!window.__bfFinalFinish){
    window.__bfFinalFinish=true;
    window.finishMove=function(){const r=baseFinish.apply(this,arguments);setTimeout(()=>{try{if(state.combo>=2&&state.chain>=2&&state.animations){const e=document.createElement('div');e.className='chain-pop';e.textContent='⚡ CHAIN REACTION';document.body.appendChild(e);setTimeout(()=>e.remove(),700)}}catch(e){}saveCombo()},90);return r};
  }
  setTimeout(()=>{try{if(typeof updateHud==='function')updateHud();if(typeof renderPieces==='function')renderPieces()}catch(e){}},0);
})();
</script>
